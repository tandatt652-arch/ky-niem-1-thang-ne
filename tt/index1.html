<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logic Bẻ Lái - The Gaslight Room</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Comic Neue', cursive, sans-serif; }
        body { background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
        
        #game-wrapper {
            position: relative; width: 420px; height: 700px; background-color: #fceabb;
            border: 4px solid #000; border-radius: 20px; box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
            overflow: hidden; display: flex; flex-direction: column;
        }
        @media (max-width: 450px), (max-height: 750px) {
            #game-wrapper { width: 100vw; height: 100vh; border-radius: 0; border: none; box-shadow: none; }
        }

        #header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background-color: #fff; border-bottom: 4px solid #000; z-index: 100; }
        .btn { background: #fff; border: 3px solid #000; border-radius: 10px; padding: 8px 12px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 3px 3px 0px #000; transition: transform 0.1s; }
        .btn:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px #000; }
        #level-title { font-size: 24px; font-weight: bold; text-transform: uppercase; display: flex; align-items: center; gap: 5px;}

        #game-area { flex: 1; position: relative; background: #fdfbfb; display: flex; justify-content: center; align-items: center; flex-direction: column; padding: 20px; overflow: hidden; transition: background 0.4s;}
        .question-text { font-size: 19px; text-align: center; position: absolute; top: 15px; width: 92%; pointer-events: none; z-index: 10; background: rgba(255,255,255,0.85); border-radius: 10px; padding: 6px 10px; border: 2px solid #000;}

        /* Modals & Popups */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal-box { background: #fff; border: 4px solid #000; border-radius: 15px; padding: 30px; text-align: center; width: 80%; box-shadow: 8px 8px 0px #000; position: relative; }
        .close-btn { position: absolute; top: -15px; right: -15px; background: #ff4757; color: #fff; border: 3px solid #000; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; font-weight: bold; cursor: pointer; }

        @keyframes shake { 0%,100% { transform: translateX(0); } 25%,75% { transform: translateX(-10px); } 50% { transform: translateX(10px); } }
        .shake-anim { animation: shake 0.4s ease-in-out; }
        @keyframes pop { 0% { transform: scale(0.8); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .pop-anim { animation: pop 0.5s ease-out; }
        .confetti { position: absolute; width: 10px; height: 10px; background: red; z-index: 300; animation: fall 1.5s linear forwards; }
        @keyframes fall { to { transform: translateY(800px) rotate(720deg); opacity: 0; } }

        .emoji-obj { font-size: 46px; position: absolute; cursor: pointer; filter: drop-shadow(2px 2px 0px #000); touch-action: none;}
        .hidden { display: none !important; }
        .erasable-chunk { color: white; font-size: 30px; transition: opacity 0.2s; padding: 5px; }

        /* Animation tuần tra Màn 6 */
        @keyframes patrolRight {
            0%, 100% { transform: translateX(0) scaleX(1); }
            49% { transform: translateX(250px) scaleX(1); }
            50% { transform: translateX(250px) scaleX(-1); }
            99% { transform: translateX(0) scaleX(-1); }
        }
        .patrol-anim { animation: patrolRight 1s linear infinite; display: inline-block; }
        .paused-anim { animation-play-state: paused !important; }

        /* Keypad Màn 8 */
        .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 180px; margin-top: 10px; }
        .key-btn { width: 50px; height: 50px; background: #fff; border: 3px solid #000; border-radius: 8px; font-size: 22px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 2px 2px 0 #000; }
        .key-btn:active { transform: translate(2px, 2px); box-shadow: none; }
        .glow-key { text-shadow: 0 0 10px yellow, 0 0 20px orange; font-weight: 900; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="header">
        <button class="btn" onclick="showModal('settings-modal')">⚙️</button>
        <div id="level-title">Level <span id="lv-num">1</span> <span id="title-lock" style="cursor:grab; z-index:150;">🔒</span></div>
        <div>
            <button class="btn" id="hint-btn">💡</button>
            <button class="btn" onclick="loadLevel(currentLevel)">🔄</button>
        </div>
    </div>

    <div id="game-area"></div>

    <!-- Modal Cài đặt -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="hideModal('settings-modal')">X</button>
            <h2>Cài đặt</h2><br>
            <p>Âm lượng: 🔊 ||||||||||</p><br>
            <div id="settings-secret-area"></div>
        </div>
    </div>

    <!-- Modal Gợi ý -->
    <div id="hint-modal" class="modal-overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="hideModal('hint-modal')">X</button>
            <h2 style="font-size: 26px;">💡 Gợi ý</h2><br>
            <p id="hint-text" style="font-size: 20px; font-weight: bold; color: #2c3e50; line-height: 1.5;"></p>
        </div>
    </div>

    <!-- Modal Tạm dừng -->
    <div id="pause-modal" class="modal-overlay">
        <div class="modal-box">
            <h2>TẠM DỪNG</h2><br>
            <button class="btn" style="width: 100%; margin-bottom: 10px;" onclick="resumeGame()">Tiếp tục</button>
            <div id="pause-x-container"></div>
            <p style="font-size: 12px; margin-top:10px;"></p>
        </div>
    </div>

    <!-- Popup Kết quả -->
    <div id="result-popup" class="modal-overlay">
        <div class="modal-box" id="result-box">
            <h2 id="result-title" style="font-size: 32px;">Thắng rồi!</h2><br>
            <p id="result-message" style="font-size: 20px; font-style: italic;">Bạn giỏi quá!</p><br><br>
            <button class="btn" id="result-btn" style="background: #4cd137; color: white;">Chơi tiếp</button>
        </div>
    </div>
</div>

<script>
    // --- 1. HỆ THỐNG TRACKING & BASE ---
    const SESSION_ID = 'VO_YEU_' + Math.random().toString(36).substring(2, 9).toUpperCase();
    let currentLevel = 1;
    const gameArea = document.getElementById('game-area');
    let levelState = {}; 
    let levelTimer = null;

    function sendTrackingData(questionContent, userChoice, gameReply) {
        const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSe4Jvx2uI27uJQTt9Xn6QdFj59c53kFNIRbxyFeirMOOEFE4g/formResponse";
        const formData = new FormData();
        formData.append("entry.1666228409", SESSION_ID);
        formData.append("entry.1275903316", questionContent);
        formData.append("entry.444679017", userChoice);
        formData.append("entry.1158846627", gameReply);

        fetch(formUrl, { method: "POST", mode: "no-cors", body: formData })
            .catch(err => console.error("Lỗi track:", err));
    }

    function triggerFail(msg, action) {
        sendTrackingData(`Level ${currentLevel}`, action, `Thua: ${msg}`);
        showResult(false, msg);
    }

    function triggerWin(msg, action) {
        sendTrackingData(`Level ${currentLevel}`, action, `Thắng: ${msg}`);
        showResult(true, msg);
    }

    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function hideModal(id) { document.getElementById(id).style.display = 'none'; }

    window.showPauseModal = () => {
        showModal('pause-modal');
        if (currentLevel === 6) {
            levelState.isPaused = true;
            let guard = document.getElementById('l6-guard');
            if (guard) guard.classList.add('paused-anim');
        }
    };

    window.resumeGame = () => {
        hideModal('pause-modal');
        if (currentLevel === 6) {
            levelState.isPaused = false;
            let guard = document.getElementById('l6-guard');
            if (guard) guard.classList.remove('paused-anim');
            
            const pauseX = document.getElementById('pause-x');
            const spikes = document.getElementById('l6-spikes');
            if(levelState.hasBridge && pauseX && pauseX.parentNode !== gameArea) {
                gameArea.appendChild(pauseX);
                pauseX.style.position = 'absolute';
                pauseX.style.left = '70px';
                pauseX.style.top = '245px';
                pauseX.style.margin = '0';
                pauseX.style.opacity = '1';
                pauseX.style.zIndex = '35';
            }
        }
    };

    function showResult(isWin, msg) {
        document.querySelectorAll('.modal-overlay').forEach(el => el.style.display = 'none');
        const popup = document.getElementById('result-popup');
        const title = document.getElementById('result-title');
        const message = document.getElementById('result-message');
        const btn = document.getElementById('result-btn');
        const box = document.getElementById('result-box');

        popup.style.display = 'flex';
        message.innerText = msg;
        
        if (isWin) {
            title.innerText = "Vợ yêu giỏi quá!";
            title.style.color = "#4cd137";
            btn.innerText = (currentLevel === 8) ? "🎉 Phá Đảo 🎉" : "Màn Kế Tiếp ➡️";
            btn.onclick = () => { hideModal('result-popup'); nextLevel(); };
            box.className = 'modal-box pop-anim';
            createConfetti();
        } else {
            title.innerText = "MẮC BẪY RỒI!";
            title.style.color = "#e84118";
            btn.innerText = "Chơi Lại 🔄";
            btn.onclick = () => { hideModal('result-popup'); loadLevel(currentLevel); };
            box.className = 'modal-box shake-anim';
            document.getElementById('game-wrapper').classList.remove('shake-anim');
            void document.getElementById('game-wrapper').offsetWidth; 
            document.getElementById('game-wrapper').classList.add('shake-anim');
        }
    }

    function createConfetti() {
        for(let i=0; i<35; i++) {
            let conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + '%';
            conf.style.backgroundColor = ['#e84118', '#4cd137', '#fbc531', '#00a8ff'][Math.floor(Math.random()*4)];
            document.getElementById('game-wrapper').appendChild(conf);
            setTimeout(() => conf.remove(), 1500);
        }
    }

    function nextLevel() {
        currentLevel++;
        if (currentLevel > 8) {
            currentLevel = 1;
            alert("Chúc mừng vợ đã xuất sắc phá đảo toàn bộ 8 màn câu đố Gaslight đỉnh cao!");
            sendTrackingData("Kết thúc", "Hoàn thành game", "Đã phá đảo 8 màn");
        }
        loadLevel(currentLevel);
    }

    // --- ENGINE KÉO THẢ TỐI ƯU ---
    function makeDraggable(el, onDrag, onDrop, onDragStart) {
        let isDown = false;
        el.style.touchAction = 'none';
        let startX, startY;
        let initialLeft, initialTop;

        el.onpointerdown = (e) => {
            if (onDragStart && onDragStart(e) === false) return;
            isDown = true;
            startX = e.clientX; startY = e.clientY;
            
            const stylePos = window.getComputedStyle(el).position;
            if (stylePos === 'static' || stylePos === 'relative') {
                el.style.position = 'relative';
                initialLeft = parseFloat(el.style.left) || 0;
                initialTop = parseFloat(el.style.top) || 0;
            } else {
                initialLeft = el.offsetLeft;
                initialTop = el.offsetTop;
                el.style.right = 'auto';
                el.style.bottom = 'auto';
            }
            
            el.style.zIndex = 1000;
        };

        document.addEventListener('pointermove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            let dx = e.clientX - startX; 
            let dy = e.clientY - startY;
            
            el.style.left = initialLeft + dx + 'px';
            el.style.top = initialTop + dy + 'px';
            
            if(onDrag && onDrag(e, dx, dy) === false) {
                isDown = false;
            }
        }, {passive: false});

        document.addEventListener('pointerup', (e) => {
            if (!isDown) return;
            isDown = false;
            el.style.zIndex = 50;
            if(onDrop) onDrop(e);
        });
    }

    function checkCollision(el1, el2, shrink1 = 0, shrink2 = 0) {
        if (!el1 || !el2) return false;
        const r1 = el1.getBoundingClientRect(); 
        const r2 = el2.getBoundingClientRect();
        return !(
            (r1.right - shrink1) < (r2.left + shrink2) || 
            (r1.left + shrink1) > (r2.right - shrink2) || 
            (r1.bottom - shrink1) < (r2.top + shrink2) || 
            (r1.top + shrink1) > (r2.bottom - shrink2)
        );
    }

    // --- MAIN LOADER ---
    function loadLevel(level) {
        clearInterval(levelTimer);
        document.onpointerup = null; 

        const lock = document.getElementById('title-lock');
        lock.style.display = (level === 2) ? 'inline-block' : 'none'; 
        lock.style.left = '0px'; 
        lock.style.top = '0px';

        // Thiết lập Hint mặc định cho các màn (khi bấm nhấp thông thường)
        let hintBtn = document.getElementById('hint-btn');
        hintBtn.innerText = "💡";
        hintBtn.onpointerdown = null; 
        hintBtn.onclick = () => { 
            document.getElementById('hint-text').innerText = "Hỏi chồng em nè chồng em chỉ cho"; 
            showModal('hint-modal'); 
            sendTrackingData(`Level ${level}`, "Bấm Hint", "Hỏi chồng em nè chồng em chỉ cho");
        };

        let pauseBox = document.getElementById('pause-x-container');
        pauseBox.innerHTML = '<div id="pause-x" class="emoji-obj" style="position: relative; font-size: 40px; margin: 0 auto; left:0; top:0;">❌</div>';

        document.getElementById('lv-num').innerText = level;
        document.getElementById('game-area').className = ''; 
        document.getElementById('game-area').style.background = '#fdfbfb';
        gameArea.innerHTML = '';
        levelState = {}; 

        switch(level) {
            case 1: renderLevel1(); break;
            case 2: renderLevel2(); break;
            case 3: renderLevel3(); break;
            case 4: renderLevel4(); break;
            case 5: renderLevel5(); break;
            case 6: renderLevel6(); break;
            case 7: renderLevel7(); break;
            case 8: renderLevel8(); break;
        }
    }

    // ================= CHI TIẾT 8 MÀN CHƠI =================

    // --- MÀN 1: CÂN CÔNG LÝ ---
    function renderLevel1() {
        levelState = { isScrewed: false };
        gameArea.innerHTML = `
            <div class="question-text">Hãy giữ chiếc cân thăng bằng trong 5 giây.</div>
            <div id="l1-screw" class="emoji-obj hidden" style="top:50px; left:200px; font-size:30px; z-index:100;">🔩</div>
            <div style="position:relative; width: 300px; height: 200px; margin-top: 150px;">
                <div style="width: 10px; height: 150px; background: #000; position: absolute; bottom: 0; left: 145px;"></div>
                <div id="l1-beam" style="width: 280px; height: 10px; background: #000; position: absolute; bottom: 140px; transform-origin: center; transform: rotate(20deg); transition: transform 0.5s;">
                    <div id="l1-pan-l" style="width: 80px; height: 10px; border: 3px solid #000; border-top: none; position: absolute; left: 0; top: 10px; cursor:pointer;">
                        <div id="l1-weight" style="position: absolute; bottom: 10px; left:10px; width: 60px; height: 60px; background: #7f8fa6; border: 3px solid #000; display:flex; justify-content:center; align-items:center; font-weight:bold; font-size:20px; transition: top 0.5s;">100kg</div>
                    </div>
                    <div id="l1-pan-r" style="width: 80px; height: 10px; border: 3px solid #000; border-top: none; position: absolute; right: 0; top: 10px; cursor:pointer;">
                        <div id="l1-balloon" class="emoji-obj" style="bottom: 20px; left:10px;">🎈</div>
                        <div id="l1-feather" class="emoji-obj" style="bottom: -5px; left:25px; font-size:35px;">🖌️</div>
                    </div>
                </div>
                <div id="l1-center" style="width: 20px; height: 20px; border-radius:50%; background: #e84118; position: absolute; bottom: 135px; left: 140px; z-index:5;"></div>
            </div>
        `;

        document.getElementById('l1-pan-l').onclick = () => triggerFail('Em mạnh tay quá làm gẫy cân luôn', 'Chạm đĩa trái');
        document.getElementById('l1-balloon').onclick = () => triggerFail('Quả bóng nổ làm mất cân bằng cân ròi', 'Chạm bóng bay');
        
        let hintBtn = document.getElementById('hint-btn');
        let hintTimer;
        let isHoldTriggered = false;

        hintBtn.onpointerdown = () => {
            isHoldTriggered = false;
            hintTimer = setTimeout(() => {
                isHoldTriggered = true;
                hintBtn.innerText = "💥";
                document.getElementById('l1-screw').classList.remove('hidden');
                sendTrackingData('Level 1', 'Đè nút Hint nổ ốc vít', 'Thành công Bước 1');
            }, 1500);
        };
        
        document.onpointerup = () => clearTimeout(hintTimer);

        hintBtn.onclick = () => {
            if (!isHoldTriggered) {
                document.getElementById('hint-text').innerText = "Hỏi chồng em nè chồng em chỉ cho";
                showModal('hint-modal');
                sendTrackingData('Level 1', 'Bấm Hint', 'Hỏi chồng em nè chồng em chỉ cho');
            }
        };

        const screw = document.getElementById('l1-screw');
        const center = document.getElementById('l1-center');
        makeDraggable(screw, null, () => {
            if(checkCollision(screw, center, 10, 0)) { 
                levelState.isScrewed = true;

                // --- FIX TỌA ĐỘ ỐC VÍT (Tính toán chuẩn trên mọi thiết bị) ---
                const cRect = center.getBoundingClientRect();
                const gRect = gameArea.getBoundingClientRect();
                screw.style.left = (cRect.left - gRect.left + (cRect.width / 2) - (screw.offsetWidth / 2)) + 'px';
                screw.style.top = (cRect.top - gRect.top + (cRect.height / 2) - (screw.offsetHeight / 2)) + 'px';
                // -----------------------------------------------------------

                screw.onpointerdown = null; 
                sendTrackingData('Level 1', 'Gắn ốc vít khóa cân', 'Thành công Bước 2');
            }
        });

        const feather = document.getElementById('l1-feather');
        const weight = document.getElementById('l1-weight');
        makeDraggable(feather, null, () => {
            if(checkCollision(feather, weight, 10, 0)) { 
                if(!levelState.isScrewed) {
                    triggerFail('Cục tạ quá nặng rơi xuống làm gẫy cân mất ròiii', 'Cù tạ nhưng chưa khóa ốc');
                } else {
                    weight.innerText = "🤣";
                    weight.style.bottom = "-200px"; 
                    document.getElementById('l1-beam').style.transform = "rotate(0deg)"; 
                    sendTrackingData('Level 1', 'Cù quả tạ rơi', 'Bắt đầu đếm 5s');
                    setTimeout(() => triggerWin('Vậy mà cũng làm được', 'Giữ được 5 giây'), 5000);
                }
            }
        });
    }

    // --- MÀN 2: BÀI TOÁN ĐƠN GIẢN ---
    function renderLevel2() {
        levelState = { isErased: false, clicks: 0 };
        gameArea.style.background = '#2c3e50'; 
        
        gameArea.innerHTML = `
            <div class="question-text">Tính x² + 5x + 6 = 0. Tìm x. (số 0 là chìa khóa của mọi bài toán phương trình.)</div>
            <div id="l2-board" style="width: 350px; height: 250px; border: 5px solid #8B4513; background: #2f3640; margin-top: 50px; position: relative; display:flex; justify-content:center; align-items:center; flex-direction:column;">
                <div id="l2-equation" style="display:flex; align-items:center; justify-content:center; width:100%; gap: 6px;">
                    <span class="erasable-chunk">x²</span>
                    <span class="erasable-chunk">+</span>
                    <span class="erasable-chunk">5x</span>
                    <span class="erasable-chunk">+</span>
                    <span class="erasable-chunk">6</span>
                    <span class="erasable-chunk">=</span>
                    <span id="l2-zero" style="color: white; font-size: 30px; padding: 5px; margin-left: 15px;">0</span>
                </div>
                <div id="l2-curtain" style="position: absolute; right: -10px; top: -10px; width: 50px; height: 100%; background: #c23616; cursor:pointer; z-index:10;"></div>
                <div id="l2-eraser" class="emoji-obj hidden" style="right: 10px; bottom: 10px; font-size:40px;">🧽</div>
            </div>
            <div style="margin-top: 30px; display:flex; gap:10px;">
                <div class="btn ans-btn" onclick="l2CheckAns(-2)" style="z-index: 50; position:relative;">-2</div>
                <div class="btn ans-btn" onclick="l2CheckAns(-3)" style="z-index: 50; position:relative;">-3</div>
            </div>
            <div id="l2-paper" class="emoji-obj hidden" style="top: 55%; left: 50%; transform: translateX(-50%); font-size: 60px; z-index: 10; pointer-events: none;">📄
                <span style="position:absolute; top:20px; left:15px; font-size:16px; color:black; font-weight:bold;">x=-2</span>
            </div>
        `;

        window.l2CheckAns = (val) => {
            if(val !== -2) triggerFail('Tính sai ròi!', `Chọn ${val}`);
            else if(levelState.clicks < 3) triggerFail('Em đoán lụi ròi hong tính', 'Chọn -2 nhưng chưa tìm nháp');
            else triggerWin('Đúng rồi, làm bài phải có nháp chứ!', 'Giải đúng trình tự');
        };

        const curtain = document.getElementById('l2-curtain');
        const eraser = document.getElementById('l2-eraser');
        makeDraggable(curtain, null, () => { eraser.classList.remove('hidden'); });

        const chunks = document.querySelectorAll('.erasable-chunk');
        const zero = document.getElementById('l2-zero');
        let hasFailed = false; 
        let erasedCount = 0;
        const totalChunks = chunks.length;

        makeDraggable(eraser, (e, dx, dy) => { 
            if(hasFailed) return false;
            if(checkCollision(eraser, zero, 20, 5)) {
                hasFailed = true;
                triggerFail('Em lau bay mất luôn số 0 rồi, lấy gì giải nữa?', 'Lau trúng số 0');
                return false;
            }
            chunks.forEach(chunk => {
                if (chunk.style.opacity !== '0' && checkCollision(eraser, chunk, 20, 0)) {
                    chunk.style.opacity = '0';
                    erasedCount++;
                    if (erasedCount === totalChunks && !levelState.isErased) {
                        levelState.isErased = true;
                        sendTrackingData('Level 2', 'Lau sạch đề bài', 'Thành công Bước 1');
                    }
                }
            });
        });

        const lock = document.getElementById('title-lock');

    // --- MÀN 6: ĐÀO TẨU KHỎI MÊ CUNG ---
    function renderLevel6() {
        levelState = { hasBridge: false, isPaused: false };
        gameArea.innerHTML = `
            <div class="question-text">Giúp bé Tuyến chạy về nhà</div>
            <button class="btn" style="position:absolute; top:80px; right:20px; z-index:90;" onclick="showPauseModal()">⏸️</button>
            
            <div style="position:relative; width:300px; height:400px; border:5px solid black; margin-top:80px; background: white; overflow: hidden;" id="l6-maze">
                <div id="l6-player" class="emoji-obj" style="top:10px; left:10px; font-size:30px; z-index:50;">🏃‍♀️</div>
                <div id="l6-exit" class="emoji-obj" style="bottom:10px; right:10px; font-size:40px;">🚪</div>
                
                <div id="l6-w1" style="position:absolute; top:100px; left:0; width:200px; height:10px; background:black;"></div>
                <div id="l6-w2" style="position:absolute; top:200px; right:0; width:200px; height:10px; background:black;"></div>
                
                <div id="l6-guard" class="emoji-obj patrol-anim" style="top:110px; left:10px; font-size:30px; z-index:40;">👮</div>
                <div id="l6-spikes" style="position:absolute; top:240px; left:20px; width:100px; height:45px; font-size:25px; display:flex; justify-content:center; letter-spacing:5px; color:red; text-shadow:0 0 2px red; transform: scaleY(2.4); transform-origin: bottom center;">🔺🔺🔺</div>
            </div>
        `;

        const player = document.getElementById('l6-player');
        const exit = document.getElementById('l6-exit');
        const spikes = document.getElementById('l6-spikes');
        const w1 = document.getElementById('l6-w1');
        const w2 = document.getElementById('l6-w2');
        const guard = document.getElementById('l6-guard');
        const pauseX = document.getElementById('pause-x'); 

        makeDraggable(pauseX, (e, dx, dy) => {
            if(checkCollision(pauseX, spikes, 10, 0)) {
                levelState.hasBridge = true;
                pauseX.style.opacity = '0.5';
            } else {
                levelState.hasBridge = false;
                pauseX.style.opacity = '1';
            }
        }, () => {
            if(levelState.hasBridge) {
                sendTrackingData('Level 6', 'Lấy nút X làm cầu', 'Thành công che bẫy');
            }
        });

        levelTimer = setInterval(() => {
            if (levelState.isPaused) return;
            if (checkCollision(player, guard, 5, 5)) {
                triggerFail('Bị lính canh tuần tra bắt ròi', 'Chạm lính canh');
                const evt = new PointerEvent('pointerup'); document.dispatchEvent(evt); 
            }
        }, 100);

        const maze = document.getElementById('l6-maze'); 

        makeDraggable(player, (e, dx, dy) => {
            const pRect = player.getBoundingClientRect();
            const mRect = maze.getBoundingClientRect();
            const border = 5; 

            // 1. Kiểm tra va chạm với 4 cạnh viền ngoài của mê cung
            if (
                pRect.left <= mRect.left + border ||
                pRect.right >= mRect.right - border ||
                pRect.top <= mRect.top + border ||
                pRect.bottom >= mRect.bottom - border
            ) {
                triggerFail('Em chạy đâu mà đụng đầu trúng tường vậy', 'Kéo chạm viền');
                return false;
            }

            // 2. Kiểm tra va chạm 2 bức tường chắn bên trong
            if (checkCollision(player, w1, 5, 0) || checkCollision(player, w2, 5, 0)) {
                triggerFail('Em chạy đâu mà đụng đầu trúng tường vậy', 'Kéo chạm tường');
                return false;
            }

            // 3. Kiểm tra va chạm lính gác
            if (checkCollision(player, guard, 5, 5)) {
                triggerFail('Chạy trúng vào lính canh đang tuần tra ròi', 'Chạm lính canh');
                return false; 
            }

            // 4. Kiểm tra bẫy gai (khi chưa có cầu nút X)
            if (checkCollision(player, spikes, 10, 0) && !levelState.hasBridge) {
                triggerFail('Ui da đạp trúng gai ròi, thương em quáaa', 'Kéo qua bẫy gai');
                return false;
            }

            // 5. Đến đích an toàn
            if (checkCollision(player, exit, 10, 0)) {
                triggerWin('Bé Tuyến đã về nhà an toàn ^^', 'Đi qua cầu nút X tới cửa');
                return false;
            }
        }, null, (e) => {
            if(levelState.isPaused) return false;
        });
    }

        gameArea.innerHTML = `
            <div class="question-text">Nhập mật mã 4 số để mở két.</div>

            <div id="l8-door" class="emoji-obj" style="top:80px; left:30px; font-size:60px; z-index:5;">🚪</div>
            <div id="l8-boss" class="emoji-obj hidden" style="top:80px; left:30px; font-size:55px; z-index:15; transition: left 1s ease-out;">👨‍💼</div>

            <div id="l8-breaker" class="emoji-obj" style="top:75px; right:40px; font-size:45px; z-index:8;">⚡</div>
            <div id="l8-clock" class="emoji-obj" style="top:70px; right:35px; font-size:55px; z-index:20;">🕰️</div>

            <div id="l8-safe" style="position:relative; width:270px; height:320px; background:#7f8c8d; border:5px solid #000; border-radius:15px; margin-top:100px; display:flex; flex-direction:column; align-items:center; padding:15px; box-shadow:6px 6px 0 #000; z-index:10;">
                <div id="l8-screen" style="width:200px; height:45px; background:#2c3e50; color:#2ecc71; border:3px solid #000; border-radius:8px; font-size:24px; font-weight:bold; display:flex; justify-content:center; align-items:center; letter-spacing:8px; margin-bottom:10px;">____</div>
                
                <div class="keypad-grid" id="l8-keypad">
                    <button class="key-btn" onclick="l8PressNum('1')">1</button>
                    <button class="key-btn" id="key-2" onclick="l8PressNum('2')">2</button>
                    <button class="key-btn" onclick="l8PressNum('3')">3</button>
                    <button class="key-btn" onclick="l8PressNum('4')">4</button>
                    <button class="key-btn" onclick="l8PressNum('5')">5</button>
                    <button class="key-btn" id="key-6" onclick="l8PressNum('6')">6</button>
                    <button class="key-btn" onclick="l8PressNum('7')">7</button>
                    <button class="key-btn" id="key-8" onclick="l8PressNum('8')">8</button>
                    <button class="key-btn" onclick="l8PressNum('9')">9</button>
                    <button class="key-btn" onclick="l8PressNum('C')" style="color:red; font-size:16px;">C</button>
                    <button class="key-btn" id="key-0" onclick="l8PressNum('0')">0</button>
                    <button class="key-btn" onclick="l8PressNum('E')" style="color:green; font-size:14px;">OK</button>
                </div>
            </div>

            <div id="l8-scrap" class="emoji-obj" style="bottom:20px; right:20px; font-size:40px; z-index:25;" onclick="triggerFail('Mật mã trong tờ giấy bị rách là bẫy lừa đảo!', 'Đọc giấy mồi nhử')">📜</div>
        `;

        const clock = document.getElementById('l8-clock');
        const breaker = document.getElementById('l8-breaker');
        const key2 = document.getElementById('key-2');
        const key6 = document.getElementById('key-6');
        const key0 = document.getElementById('key-0');
        const key8 = document.getElementById('key-8');
        const screen = document.getElementById('l8-screen');
        const door = document.getElementById('l8-door');
        const boss = document.getElementById('l8-boss');

        makeDraggable(clock, (e, dx, dy) => {
            if (Math.abs(dx) > 40 || Math.abs(dy) > 40) {
                if (!levelState.isClockMoved) {
                    levelState.isClockMoved = true;
                    sendTrackingData('Level 8', 'Kéo đồng hồ lộ cầu dao', 'Thành công Bước 1');
                }
            }
        });

        breaker.onclick = () => {
            if (!levelState.isClockMoved) return;
            levelState.isLightOff = !levelState.isLightOff;

            if (levelState.isLightOff) {
                gameArea.style.background = '#0a0a14';
                breaker.innerText = "🔘";
                
                // Hiển thị vân tay theo độ đậm nhạt: 2 -> 6 -> 0 -> 8
                key2.classList.add('glow-key'); key2.style.color = "#2ecc71"; key2.style.opacity = "1";
                key6.classList.add('glow-key'); key6.style.color = "#27ae60"; key6.style.opacity = "0.8";
                key0.classList.add('glow-key'); key0.style.color = "#16a085"; key0.style.opacity = "0.6";
                key8.classList.add('glow-key'); key8.style.color = "#1abc9c"; key8.style.opacity = "0.35";
                
                sendTrackingData('Level 8', 'Ngắt cầu dao điện xem vân tay', 'Thành công Bước 2');
            } else {
                gameArea.style.background = '#fdfbfb';
                breaker.innerText = "⚡";
                
                [key2, key6, key0, key8].forEach(k => {
                    if (k) {
                        k.classList.remove('glow-key');
                        k.style.color = "#000";
                        k.style.opacity = "1";
                    }
                });
            }
        };

        window.l8PressNum = (num) => {
            if (num === 'C') {
                levelState.enteredCode = "";
                screen.innerText = "____";
                return;
            }
            if (num === 'E') {
                if (levelState.enteredCode === "2608") {
                    screen.innerText = "O K";
                    screen.style.color = "#4cd137";
                    
                    door.innerText = "🚪✨";
                    boss.classList.remove('hidden');
                    setTimeout(() => {
                        boss.style.left = "140px";
                        boss.innerText = "👨‍💼🗝️";
                        sendTrackingData('Level 8', 'Nhập đúng 2608', 'Giám đốc mở két');
                        setTimeout(() => triggerWin('Mật khẩu là một ngày đặc biệt của một người đặt biệt❤️', 'Phá đảo Game'), 1200);
                    }, 500);
                } else {
                    levelState.wrongAttempts++;
                    screen.innerText = "ERR";
                    screen.style.color = "#e84118";
                    if (levelState.wrongAttempts >= 3) {
                        triggerFail('Két sắt đã bị khóa vĩnh viễn vì nhập sai quá 3 lần!', 'Nhập sai mật khẩu 3 lần');
                    } else {
                        setTimeout(() => {
                            levelState.enteredCode = "";
                            screen.innerText = "____";
                            screen.style.color = "#2ecc71";
                        }, 800);
                    }
                }
                return;
            }

            if (levelState.enteredCode.length < 4) {
                levelState.enteredCode += num;
                screen.innerText = levelState.enteredCode.padEnd(4, '_');
            }
        };
    }

    window.onload = () => {
        console.log("Game Loaded - Session ID:", SESSION_ID);
        sendTrackingData("Khởi động Game Mới (Full 8 Màn)", "Bắt đầu chơi", "Game sẵn sàng");
        loadLevel(currentLevel);
    };
</script>
</body>
</html>
