<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday To My Lover.</title>
    <style>
        :root {
            --midnight: #060814;
            --deep-violet: #1d0f35;
            --magenta: #d90f5a;
            --rose-pink: #ff749f;
            --lavender: #c4a1ff;
            --champagne: #f9e5a5;
            --cyan: #4ffaff;
            --warm-white: #fffdf5;
            --glass-bg: rgba(29, 15, 53, 0.4);
            --glass-border: rgba(196, 161, 255, 0.3);
            
            --ink: #1d0f35;
            --c-primary: #ff749f;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0; padding: 0; width: 100%;
            background-color: var(--midnight); color: var(--warm-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden; 
        }
        body { height: 400vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        ::-webkit-scrollbar { display: none; }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
        }

        button {
            background: linear-gradient(45deg, var(--magenta), var(--rose-pink)); border: none; color: white;
            padding: 12px 24px; border-radius: 30px; font-size: 16px; font-weight: bold;
            box-shadow: 0 0 15px var(--magenta); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        button:active { transform: scale(0.95); box-shadow: 0 0 5px var(--magenta); }

        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        canvas { display: block; width: 100%; height: 100%; }

        #world { position: absolute; top: 0; left: 0; width: 100%; height: 400vh; z-index: 2; pointer-events: none; }
        .scroll-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; will-change: transform; }

        /* --- MÂY MỜ ẢO --- */
        .cloud { position: absolute; background: rgba(255, 255, 255, 0.08); border-radius: 100px; filter: blur(12px); left: -300px; pointer-events: none; }
        @keyframes floatCloud { 0% { transform: translateX(0); } 100% { transform: translateX(150vw); } }

        #ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; display: flex; justify-content: center; align-items: center; }
        #opening { position: fixed; width: 100%; height: 100%; background: var(--midnight); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; pointer-events: auto; transition: opacity 2s ease; }
        .opening-star { width: 4px; height: 4px; background: var(--warm-white); border-radius: 50%; box-shadow: 0 0 10px 2px var(--warm-white), 0 0 30px 5px var(--champagne); animation: pulseStar 2s infinite alternate, rotateStar 10s linear infinite; cursor: pointer; position: relative; }
        .opening-star::before, .opening-star::after { content: ''; position: absolute; top: 50%; left: 50%; background: var(--warm-white); transform: translate(-50%, -50%); border-radius: 50%; filter: blur(2px); }
        .opening-star::before { width: 40px; height: 1px; } .opening-star::after { width: 1px; height: 40px; }
        .opening-text { margin-top: 40px; font-size: 14px; color: var(--lavender); opacity: 0; letter-spacing: 2px; text-align: center; text-shadow: 0 0 10px var(--lavender); transition: opacity 2s; }
        @keyframes pulseStar { 0% { transform: scale(1); box-shadow: 0 0 10px 2px var(--warm-white), 0 0 20px 2px var(--champagne); } 100% { transform: scale(1.5); box-shadow: 0 0 20px 5px var(--warm-white), 0 0 50px 10px var(--champagne); } }
        @keyframes rotateStar { 100% { transform: rotate(360deg); } }

        .aurora { position: absolute; width: 200%; height: 50%; top: 20%; left: -50%; background: linear-gradient(90deg, transparent, rgba(196, 161, 255, 0.1), rgba(79, 250, 255, 0.1), rgba(217, 15, 90, 0.1), transparent); filter: blur(60px); border-radius: 50%; animation: auroraWove 15s infinite alternate ease-in-out; opacity: 0; transition: opacity 3s; }
        @keyframes auroraWove { 0% { transform: translateY(0) scaleY(1) rotate(-5deg); } 100% { transform: translateY(-30px) scaleY(1.5) rotate(5deg); } }

        .interactive-obj { pointer-events: auto; cursor: pointer; position: absolute; }
        .moon { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, var(--warm-white), #e0c3fc 40%, #8e44ad 90%); box-shadow: 0 0 50px 10px rgba(196, 161, 255, 0.4), inset -20px -20px 40px rgba(0,0,0,0.5); }
        .moon-crater { position: absolute; border-radius: 50%; background: rgba(0,0,0,0.1); box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2), inset -1px -1px 2px rgba(255,255,255,0.2); }
        .crater1 { width: 30px; height: 30px; top: 20%; left: 40%; } .crater2 { width: 15px; height: 15px; top: 50%; left: 20%; } .crater3 { width: 20px; height: 25px; top: 60%; left: 60%; transform: rotate(45deg); }

        .planet { border-radius: 50%; box-shadow: inset -10px -10px 20px rgba(0,0,0,0.6), 0 0 20px rgba(255,255,255,0.1); }
        .planet-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotateX(70deg) rotateY(-20deg); border-radius: 50%; border: 4px solid transparent; }
        #planet1 { width: 80px; height: 80px; background: linear-gradient(45deg, var(--rose-pink), var(--deep-violet)); }
        #planet2 { width: 60px; height: 60px; background: linear-gradient(135deg, var(--cyan), var(--midnight)); }
        #planet2 .planet-ring { width: 120px; height: 120px; border-top-color: var(--cyan); border-bottom-color: rgba(79, 250, 255, 0.3); }

        .mascot-svg { width: 100%; height: 100%; filter: drop-shadow(0 0 10px var(--cyan)); }
        #easter-egg-mascot { width: 50px; height: 50px; transition: transform 0.3s, left 1s; }

        /* --- SÂN KHẤU CUỐI CÙNG --- */
        #finale-stage { position: absolute; top: 350vh; left: 50%; width: 320px; height: 150px; transform: translateX(-50%); pointer-events: none; }
        #finale-stage > * { pointer-events: auto; }

        #cake-scene { display: flex; flex-direction: column; align-items: center; bottom: 0; left: 50%; transform: translateX(-50%); }
        .cake-tier { background: linear-gradient(to right, #ffccdf, #ff99bb); border-radius: 10px; box-shadow: inset 0 5px 10px rgba(255,255,255,0.5), 0 5px 15px rgba(0,0,0,0.3); position: relative;}
        .cake-bottom { width: 180px; height: 60px; z-index: 1; }
        .cake-middle { width: 140px; height: 50px; z-index: 2; margin-bottom: -10px; }
        .cake-top { width: 100px; height: 45px; z-index: 3; margin-bottom: -10px; }
        .icing { position: absolute; top: 0; left: 0; width: 100%; height: 20px; background: var(--warm-white); border-radius: 10px 10px 50% 50%; }
        .candle-container { display: flex; justify-content: center; gap: 15px; margin-bottom: -5px; z-index: 4; }
        .candle { width: 8px; height: 35px; background: linear-gradient(to right, #a1c4fd, #c2e9fb); border-radius: 4px; position: relative; }
        .flame { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 10px; height: 15px; background: var(--champagne); border-radius: 50% 50% 20% 20%; box-shadow: 0 0 10px var(--champagne), 0 0 20px #ff9900; animation: flicker 0.1s infinite alternate; }
        @keyframes flicker { 0% { transform: translateX(-50%) scale(1) skewX(2deg); opacity: 0.9;} 100% { transform: translateX(-50%) scale(1.1) skewX(-2deg); opacity: 1;} }

        /* --- THIẾT KẾ NPC TROLL --- */
        #troll {
            position: absolute; right: 18px; top: 18px; width: 170px; height: 155px; z-index: 160; cursor: pointer; transition: .25s; filter: drop-shadow(0 8px 0 #0002);
            /* Override vị trí lên sân khấu cuối */
            top: auto; right: auto; bottom: 0; left: -80px; transform-origin: bottom center; transform: scale(0.7);
        }
        .trollFace { width: 96px; height: 96px; margin-left: auto; border: 4px solid var(--ink); border-radius: 45% 45% 50% 50%; background: #f7d07d; position: relative; animation: breathe 2s infinite ease-in-out; }
        .trollFace:before, .trollFace:after { content: ""; position: absolute; top: 28px; width: 18px; height: 12px; border-radius: 50%; background: var(--ink); }
        .trollFace:before { left: 18px; } .trollFace:after { right: 18px; }
        .trollMouth { position: absolute; left: 20px; right: 20px; bottom: 15px; height: 25px; border: 4px solid var(--ink); border-top: 0; border-radius: 0 0 60px 60px; background: #fff; }
        
        #troll .bubble {
            position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); border: 3px solid var(--ink); border-radius: 14px;
            padding: 8px 12px; font-size: 18px; font-weight: 800; color: var(--ink);
            white-space: nowrap; opacity: 0; transition: opacity 0.5s; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #troll .bubble::after {
            content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
            border-width: 6px 6px 0; border-style: solid; border-color: var(--ink) transparent transparent transparent;
        }

        /* --- THIẾT KẾ PLAYER (BÉ) --- */
        .player { position:absolute; width:56px; height:66px; z-index:20; transform-origin:center bottom; background:transparent; border:none; bottom: 0; right: 20px; }
        .chibi { position:relative; width:100%; height:100%; animation:bounce 1.5s infinite ease-in-out; }
        .cb-head { position:absolute; width:46px; height:46px; border:4px solid var(--ink); border-radius:45%; left:5px; top:0; z-index:2; background:#ffe6d5; }
        .cb-hair { position:absolute; width:54px; height:25px; background:var(--ink); border-radius:25px 25px 0 0; top:-4px; left:-4px; z-index:3; }
        .cb-backhair { position:absolute; width:56px; height:50px; background:var(--ink); border-radius:30px; top:10px; left:0; z-index:1; }
        .cb-eye { position:absolute; top:20px; width:6px; height:10px; background:var(--ink); border-radius:50%; z-index:3; }
        .cb-eye.e1 { left:8px; } .cb-eye.e2 { right:8px; }
        .cb-blush { position:absolute; top:26px; width:8px; height:5px; background:#ff7ca8; border-radius:50%; opacity:0.6; z-index:3; }
        .cb-blush.b1 { left:2px; } .cb-blush.b2 { right:2px; }
        .cb-mouth { position:absolute; left:14px; top:30px; width:10px; height:5px; border-radius:0 0 10px 10px; background:var(--ink); z-index:3; }
        .cb-body { position:absolute; width:34px; height:26px; background:var(--c-primary); border:4px solid var(--ink); border-radius:10px; bottom:0; left:11px; z-index:2; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

        /* --- UI & MODALS --- */
        .modal { position: absolute; opacity: 0; pointer-events: none; transform: scale(0.9) translateY(20px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center; max-width: 85%; width: 320px; z-index: 150; }
        .modal.active { opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); }
        .modal h2 { margin-top: 0; color: var(--champagne); font-weight: normal; font-size: 20px;}
        #wish-textarea { width: 100%; height: 80px; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); border-radius: 10px; color: white; padding: 10px; font-family: inherit; resize: none; margin-bottom: 15px; outline: none; }
        #wish-textarea:focus { border-color: var(--champagne); box-shadow: 0 0 10px rgba(249, 229, 165, 0.3); }
        .close-btn { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .close-btn::before, .close-btn::after { content: ''; position: absolute; width: 15px; height: 2px; background: white; }
        .close-btn::before { transform: rotate(45deg); } .close-btn::after { transform: rotate(-45deg); }
        .star-message-card { background: linear-gradient(135deg, var(--champagne), #ffe5b4); color: #5a3d1b; font-weight: bold; border-radius: 10px; padding: 15px 25px; box-shadow: 0 0 20px var(--champagne); font-size: 16px; }

        #wish-star { width: 30px; height: 30px; position: absolute; background: radial-gradient(circle, var(--warm-white), var(--champagne), transparent); border-radius: 50%; box-shadow: 0 0 30px 10px var(--champagne); display: none; cursor: pointer; animation: float 3s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -10px); } }

        #finale-ui { text-align: center; display: none; opacity: 0; transition: opacity 2s; }
        .giant-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; height: 300px; border-radius: 50%; border: 2px solid var(--champagne); box-shadow: 0 0 50px var(--champagne), inset 0 0 50px var(--champagne); animation: expandRing 4s infinite alternate; pointer-events: none; }
        @keyframes expandRing { 0% { width: 300px; height: 300px; opacity: 0.5; } 100% { width: 320px; height: 320px; opacity: 1; border-width: 4px; } }
        .birthday-text { font-size: 40px; font-weight: bold; color: var(--warm-white); text-shadow: 0 0 20px var(--magenta), 0 0 40px var(--rose-pink); margin: 0; line-height: 1.2; }
        .sub-text { margin-top: 15px; font-size: 16px; color: var(--lavender); font-style: italic; }

        .hint-text { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); font-size: 13px; color: rgba(255,255,255,0.7); letter-spacing: 1px; animation: pulseText 2s infinite; pointer-events: none; z-index: 100; }
        @keyframes pulseText { 0%, 100% { opacity: 0.4; transform: translateX(-50%) translateY(0); } 50% { opacity: 1; transform: translateX(-50%) translateY(-5px); } }
        
        #audio-toggle { position: fixed; top: 20px; right: 20px; width: 30px; height: 30px; z-index: 500; cursor: pointer; display: none; }
        .audio-icon { fill: rgba(255,255,255,0.5); transition: fill 0.3s; }
        #audio-toggle:hover .audio-icon { fill: white; }

        .star-fragment { position: absolute; width: 5px; height: 5px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px 2px var(--cyan); pointer-events: auto; cursor: pointer; }
        .star-fragment::after { content: ''; position: absolute; top: -25px; left: -25px; right: -25px; bottom: -25px; }
        .fragment-trail { position: absolute; top: 50%; left: 50%; width: 50px; height: 1.5px; background: linear-gradient(90deg, var(--cyan), transparent); transform-origin: left center; pointer-events: none; }

        #moon-obj { top: 60vh; right: 10%; } 
        #planet1 { top: 80vh; left: 15%; }
        #easter-egg-mascot { top: 130vh; left: 10%; }
        #planet2 { top: 180vh; right: 20%; }
        #wish-star { top: 310vh; left: 50%; transform: translateX(-50%); }

    </style>
</head>

        // --- HỆ THỐNG TRACKING GOOGLE FORM ---
        window.USER_SESSION_ID = "ID_" + Math.random().toString(36).substring(2, 9).toUpperCase();
        
        function trackAction(actionName, detailText, responseMsg) {
            const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSe4Jvx2uI27uJQTt9Xn6QdFj59c53kFNIRbxyFeirMOOEFE4g/formResponse";
            const formData = new URLSearchParams();
            formData.append("entry.1666228409", window.USER_SESSION_ID);
            formData.append("entry.1275903316", actionName);
            formData.append("entry.444679017", detailText);

    <script>
        const MathUtils = {
            rand: (min, max) => Math.random() * (max - min) + min,
            randInt: (min, max) => Math.floor(Math.random() * (max - min + 1)) + min,
            distance: (p1, p2) => Math.hypot(p2.x - p1.x, p2.y - p1.y)
        };

        const State = {
            isAwake: false, scrollY: 0,
            width: window.innerWidth, height: window.innerHeight,
            finaleTriggered: false, mascotGreeted: false,
            dpr: Math.min(window.devicePixelRatio || 1, 2)
        };

        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        let particles = [], stars = [], fireworks = [], shockwaves = [];

        function resizeCanvas() {
            State.width = window.innerWidth; State.height = window.innerHeight;
            canvas.width = State.width * State.dpr; canvas.height = State.height * State.dpr;
            ctx.scale(State.dpr, State.dpr);
            if(!State.isAwake) initStars();
        }
        window.addEventListener('resize', resizeCanvas);

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = MathUtils.rand(0, State.width); this.y = MathUtils.rand(0, State.height * 2); 
                this.size = MathUtils.rand(0.5, 2.5); this.alpha = MathUtils.rand(0.1, 0.8);
                this.speed = MathUtils.rand(0.01, 0.05); this.blink = Math.random() > 0.5;
            }
            update() {
                if(this.blink) {
                    this.alpha += this.speed;
                    if(this.alpha > 1 || this.alpha < 0.1) this.speed *= -1;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(255, 253, 245, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, (this.y - State.scrollY * 0.15) % (State.height * 2), this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Particle {
            constructor(x, y, color, type) {
                this.x = x; this.y = y; this.color = color; this.type = type; 
                this.friction = type === 0 ? 0.95 : 0.97; 
                this.gravity = 0.04; this.alpha = 1;
                this.decay = type === 0 ? MathUtils.rand(0.01, 0.03) : MathUtils.rand(0.01, 0.02); 
                
                this.size = type === 0 ? MathUtils.rand(1.5, 4.0) : MathUtils.rand(2.0, 3.5);

                if (type === 0) {
                    let angle = MathUtils.rand(0, Math.PI * 2);
                    let speed = MathUtils.rand(4, 12); 
                    this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                } else { 
                    this.vx = 0; this.vy = 0;
                }
            }
            update() {
                this.vx *= this.friction; this.vy *= this.friction; this.vy += this.gravity;
                this.x += this.vx; this.y += this.vy; this.alpha -= this.decay;
            }
            draw() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha); ctx.fillStyle = this.color;
                ctx.shadowBlur = 10; ctx.shadowColor = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            }
        }

        function generateShapeParticles(cx, cy, color, type) {
            let points = []; let scale = 5.0; 
            
            const makeSegments = (ptsArray) => {
                let res = [];
                for(let i=0; i<ptsArray.length; i+=2) res.push([ptsArray[i], ptsArray[i+1]]);
                return res;
            }
            const interpolateSegments = (segments, density) => {
                let path = [];
                segments.forEach(seg => {
                    let l = Math.hypot(seg[1].x - seg[0].x, seg[1].y - seg[0].y);
                    let count = Math.max(2, Math.round(l * density)); 
                    for(let j=0; j<=count; j++) {
                        let t = j/count;
                        path.push({ x: seg[0].x + (seg[1].x - seg[0].x)*t, y: seg[0].y + (seg[1].y - seg[0].y)*t });
                    }
                });
                return path;
            }

            if (type === 'heart') {
                for(let i=0; i<25; i++) { 
                    let t = Math.PI * 2 * (i/25);
                    let hx = 16 * Math.pow(Math.sin(t), 3) * 0.05;
                    let hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 0.05;
                    points.push({x: hx, y: hy});
                }
                scale = 7.0; 
            } 
            else if (type === 'star') {
                let pts = [
                    {x: 0, y: -1}, {x: 0.59, y: 0.81}, {x: 0.59, y: 0.81}, {x: -0.95, y: -0.31},
                    {x: -0.95, y: -0.31}, {x: 0.95, y: -0.31}, {x: 0.95, y: -0.31}, {x: -0.59, y: 0.81},
                    {x: -0.59, y: 0.81}, {x: 0, y: -1}
                ];
                points = interpolateSegments(makeSegments(pts), 12); 
                scale = 4.5;
            }
            else if (type === 'cat') {
                let pts = [
                    {x: -0.5, y: -0.4}, {x: -0.8, y: -1}, {x: -0.8, y: -1}, {x: -0.1, y: -0.7}, 
                    {x: 0.1, y: -0.7}, {x: 0.8, y: -1}, {x: 0.8, y: -1}, {x: 0.5, y: -0.4},   
                    {x: -0.5, y: -0.4}, {x: -0.8, y: 0.2}, {x: -0.8, y: 0.2}, {x: -0.4, y: 0.8},
                    {x: -0.4, y: 0.8}, {x: 0.4, y: 0.8}, {x: 0.4, y: 0.8}, {x: 0.8, y: 0.2},
                    {x: 0.8, y: 0.2}, {x: 0.5, y: -0.4}, {x: -0.1, y: -0.7}, {x: 0.1, y: -0.7} 
                ];
                points = interpolateSegments(makeSegments(pts), 10); 
                let facePts = [
                    {x: -0.35, y: -0.1}, {x: -0.25, y: -0.1}, {x: 0.25, y: -0.1}, {x: 0.35, y: -0.1},   
                    {x: 0, y: 0.15}, {x: 0, y: 0.15}, {x: 0, y: 0.15}, {x: -0.15, y: 0.25},     
                    {x: 0, y: 0.15}, {x: 0.15, y: 0.25}, {x: -0.5, y: 0.1}, {x: -0.8, y: 0.05},    
                    {x: -0.5, y: 0.2}, {x: -0.8, y: 0.25}, {x: 0.5, y: 0.1}, {x: 0.8, y: 0.05},      
                    {x: 0.5, y: 0.2}, {x: 0.8, y: 0.25}       
                ];
                points = points.concat(interpolateSegments(makeSegments(facePts), 6)); 
                scale = 4.0;
            }
            else if (type === 'cup') {
                let pts = [
                    {x: -0.6, y: -0.6}, {x: 0.6, y: -0.6}, {x: 0.6, y: -0.6}, {x: 0.4, y: 0.8},   
                    {x: 0.4, y: 0.8}, {x: -0.4, y: 0.8}, {x: -0.4, y: 0.8}, {x: -0.6, y: -0.6}, 
                    {x: 0, y: -0.6}, {x: 0.2, y: -1.2}     
                ];
                points = interpolateSegments(makeSegments(pts), 12); 
                scale = 4.5;
            }
            else if (type === 'cake') {
                let pts = [
                    {x: -0.7, y: 0.8}, {x: 0.7, y: 0.8}, {x: 0.7, y: 0.8}, {x: 0.7, y: 0.2}, 
                    {x: 0.7, y: 0.2}, {x: -0.7, y: 0.2}, {x: -0.7, y: 0.2}, {x: -0.7, y: 0.8},
                    {x: -0.4, y: 0.2}, {x: -0.4, y: -0.4}, {x: -0.4, y: -0.4}, {x: 0.4, y: -0.4}, 
                    {x: 0.4, y: -0.4}, {x: 0.4, y: 0.2}, {x: 0, y: -0.4}, {x: 0, y: -0.8}    
                ];
                points = interpolateSegments(makeSegments(pts), 12); 
                points.push({x: 0, y: -1.0}, {x: -0.05, y: -0.95}, {x: 0.05, y: -0.95}); 
                scale = 4.5;
            }

            points.forEach(pt => {
                let p = new Particle(cx, cy, color, 1);
                p.vx = (pt.x * scale) + MathUtils.rand(-0.2, 0.2); 
                p.vy = (pt.y * scale) + MathUtils.rand(-0.2, 0.2);
                particles.push(p);
            });
        }

        class Firework {
            constructor(sx, sy, tx, ty) {
                this.x = sx; this.y = sy; this.tx = tx; this.ty = ty;
                this.distanceToTarget = MathUtils.distance({x:sx, y:sy}, {x:tx, y:ty});
                this.distanceTraveled = 0;
                let angle = Math.atan2(ty - sy, tx - sx); let speed = 7;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.trail = [];
                this.color = ['#ff749f', '#c4a1ff', '#4ffaff', '#f9e5a5'][MathUtils.randInt(0,3)];
            }
            update() {
                this.trail.push({x: this.x, y: this.y});
                if(this.trail.length > 5) this.trail.shift();
                this.vx *= 0.99; this.vy += 0.02; this.x += this.vx; this.y += this.vy;
                this.distanceTraveled += Math.hypot(this.vx, this.vy);
                
                if(this.distanceTraveled >= this.distanceToTarget || this.vy >= 0) {
                    this.explode(); return false;
                }
                return true;
            }
            explode() {
                let r = Math.random(); let type = 'normal';
                
                if (r > 0.85) type = 'cake';
                else if (r > 0.70) type = 'cup';
                else if (r > 0.55) type = 'cat';
                else if (r > 0.40) type = 'star';
                else if (r > 0.25) type = 'heart';

                if (type === 'normal') {
                    for(let i=0; i<35; i++) particles.push(new Particle(this.x, this.y, this.color, 0));
                } else {
                    generateShapeParticles(this.x, this.y, this.color, type);
                }
                shockwaves.push({x: this.x, y: this.y, radius: 0, alpha: 0.5, color: this.color});
                
                if(Math.random() > 0.6) {
                    trackAction("Bắn Pháo Hoa", `Vị trí: ${Math.round(this.tx)}, ${Math.round(this.ty)}`, `Kiểu nổ: ${type}`);
                }
            }
            draw() {
                ctx.beginPath();
                if(this.trail.length > 0) {
                    ctx.moveTo(this.trail[0].x, this.trail[0].y); ctx.lineTo(this.x, this.y);
                    ctx.strokeStyle = this.color; ctx.lineWidth = 2; ctx.stroke();
                }
            }
        }

        function initStars() {
            stars = []; let count = Math.min(window.innerWidth / 3, 200);
            for(let i=0; i<count; i++) stars.push(new Star());
        }

        function launchFirework(tx = null, ty = null) {
            if(!State.isAwake) return;
            let sx = State.width / 2 + MathUtils.rand(-50, 50); let sy = State.height;
            if(!tx) { tx = MathUtils.rand(State.width*0.1, State.width*0.9); ty = MathUtils.rand(State.height*0.1, State.height*0.5); }
            fireworks.push(new Firework(sx, sy, tx, ty));
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, State.width, State.height);
            stars.forEach(s => { s.update(); s.draw(); });

            if(State.isAwake) {
                for(let i = shockwaves.length-1; i>=0; i--) {
                    let sw = shockwaves[i];
                    ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI*2);
                    ctx.fillStyle = sw.color; ctx.globalAlpha = sw.alpha; ctx.fill(); ctx.globalAlpha = 1;
                    sw.radius += 10; sw.alpha -= 0.05;
                    if(sw.alpha <= 0) shockwaves.splice(i, 1);
                }
                for(let i = fireworks.length-1; i>=0; i--) {
                    if(!fireworks[i].update()) fireworks.splice(i, 1); else fireworks[i].draw();
                }
                for(let i = particles.length-1; i>=0; i--) {
                    particles[i].update(); particles[i].draw();
                    if(particles[i].alpha <= 0) particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animateCanvas);
        }

        function spawnFragment() {
            if(!State.isAwake) return;
            const frag = document.createElement('div'); frag.className = 'star-fragment';
            
            let startY = State.scrollY + MathUtils.rand(-50, State.height/2);
            let startX = State.width + 50; let endX = -50; let endY = startY + MathUtils.rand(100, 300);
            
            frag.style.left = startX + 'px'; frag.style.top = startY + 'px';
            
            const trail = document.createElement('div'); trail.className = 'fragment-trail';
            let angle = Math.atan2(endY - startY, endX - startX) * 180 / Math.PI;
            trail.style.transform = `translate(0, -50%) rotate(${angle + 180}deg)`;
            
            frag.appendChild(trail); document.getElementById('world').appendChild(frag);
            frag.animate([ { transform: `translate(0, 0)` }, { transform: `translate(${endX - startX}px, ${endY - startY}px)` } ], { duration: MathUtils.rand(2000, 4000), easing: 'linear' }).onfinish = () => frag.remove();

            frag.addEventListener('click', (e) => {
                e.stopPropagation(); frag.remove();
                for(let i=0; i<20; i++) particles.push(new Particle(e.clientX, e.clientY, '#4ffaff', 0));
                showStarMessage();
                trackAction("Khám phá", "Chạm vào sao băng", "Hiện lời chúc bay qua");
            });

            // SỬA LỖI LAG: Tự động lặp lại thời gian sinh sao băng dựa vào state
            let delay = State.finaleTriggered ? MathUtils.rand(1000, 2500) : MathUtils.rand(3000, 8000);
            setTimeout(spawnFragment, delay);
        }

        function initApp() {
            resizeCanvas(); animateCanvas();
            setTimeout(() => { document.getElementById('opening-text-1').style.opacity = 1; }, 1000);
            setTimeout(() => { document.getElementById('opening-text-2').style.opacity = 1; }, 3500);
            if(CONFIG.backgroundMusic) document.getElementById('bgm').src = CONFIG.backgroundMusic;
            
            trackAction("Truy cập Web", "Đã mở link", "Đang chờ thao tác đầu tiên");
        }

        document.getElementById('btn-start').addEventListener('click', (e) => {
            if(State.isAwake) return;
            e.stopPropagation();
            trackAction("Khởi động", "Chạm vào ngôi sao trung tâm", "Thế giới bừng sáng");
            
            let bgm = document.getElementById('bgm');
            if(bgm.src) { bgm.play().catch(err => console.log("Audio prevented")); document.getElementById('audio-toggle').style.display = 'block'; }
            shockwaves.push({x: State.width/2, y: State.height/2, radius: 0, alpha: 1, color: '#fff'});
            
            let opening = document.getElementById('opening'); opening.style.opacity = 0; opening.style.pointerEvents = 'none';
            State.isAwake = true; document.getElementById('aurora-eff').style.opacity = 1;
            
            setTimeout(() => { document.getElementById('scroll-hint').style.display = 'block'; }, 1000);
            
            // CHỈ GỌI VÒNG LẶP SAO BĂNG ĐÚNG 1 LẦN Ở ĐÂY
            setTimeout(spawnFragment, 2000); 
            
            launchFirework(); setTimeout(launchFirework, 500);
        });

        document.addEventListener('click', (e) => {
            if(!State.isAwake) return;
            if(e.target.closest('.interactive-obj') || e.target.closest('.modal') || e.target.closest('#audio-toggle')) return;
            launchFirework(e.clientX, e.clientY);
        });

        window.addEventListener('scroll', () => {
            if(!State.isAwake) return;
            State.scrollY = window.scrollY;
            document.querySelectorAll('.scroll-layer').forEach(layer => {
                let speed = layer.getAttribute('data-speed'); let yPos = -(State.scrollY * speed);
                layer.style.transform = `translateY(${yPos}px)`;
            });

            let hint = document.getElementById('scroll-hint');
            if(State.scrollY > 50 && hint.innerText.includes("vuốt lên")) hint.style.opacity = 0;

            let maxScroll = document.body.scrollHeight - window.innerHeight;
            if (State.scrollY >= maxScroll - 100 && !State.mascotGreeted) {
                State.mascotGreeted = true;
                
                let speech = document.getElementById('main-mascot-speech');
                speech.innerHTML = "tới nơi rồi nè!<br>chạm vào bánh để ước nha"; speech.style.opacity = 1;
                hint.innerText = "chạm vào bánh sinh nhật nhé"; hint.style.opacity = 1;
                
                trackAction("Cuộn trang", "Kéo đến cuối trang", "Hiện cảnh bánh kem và nhân vật");
                setTimeout(() => { speech.style.opacity = 0; hint.style.opacity = 0; }, 5000);
            }
        });

        document.getElementById('audio-toggle').addEventListener('click', () => {
            let bgm = document.getElementById('bgm'); if(bgm.paused) bgm.play(); else bgm.pause();
        });

        const popMsg = (el, e, color, msg) => {
            e.stopPropagation();
            for(let i=0; i<20; i++) particles.push(new Particle(e.clientX, e.clientY, color, 0));
            document.getElementById('message-content').innerText = msg;
            document.getElementById('message-modal').classList.add('active');
        };

        document.getElementById('moon-obj').addEventListener('click', (e) => {
            popMsg(this, e, '#e0c3fc', CONFIG.moonLetter);
            trackAction("Khám phá", "Click Mặt trăng", "Hiện lời nhắn");
        });
        
        document.getElementById('planet1').addEventListener('click', (e) => {
            popMsg(this, e, '#ff749f', "Hành tinh Ký ức: Nơi cất giữ những khoảnh khắc của hai ta.");
            trackAction("Khám phá", "Click Hành tinh hồng", "Hiện lời nhắn");
        });
        
        document.getElementById('easter-egg-mascot').addEventListener('click', (e) => {
            e.stopPropagation(); let el = e.currentTarget; let clicks = parseInt(el.getAttribute('data-clicks')) + 1;
            el.setAttribute('data-clicks', clicks);
            let mouth = el.querySelector('.ee-mouth'); let speech = document.getElementById('ee-speech');
            el.style.transform = `scale(1.1) rotate(${MathUtils.rand(-10,10)}deg)`;
            setTimeout(() => el.style.transform = 'scale(1) rotate(0)', 200);

            let msgReturn = "...";
            if(clicks === 2) { mouth.setAttribute('d', 'M 40 70 Q 50 65 60 70'); msgReturn = "Cau mày"; }
            else if (clicks === 5) { el.style.left = '0%'; msgReturn = "Lùi lại"; }
            else if (clicks === 7) { speech.innerText = "đừng chọc tui nữa"; speech.style.opacity = 1; setTimeout(() => speech.style.opacity = 0, 2000); msgReturn = "Thoại: Đừng chọc"; }
            else if (clicks >= 10) { for(let i=0; i<20; i++) particles.push(new Particle(e.clientX, e.clientY, '#4ffaff', 0)); el.style.opacity = 0; msgReturn = "Nổ tung biến mất"; }
            
            trackAction("Khám phá", `Click Mascot bí mật (Lần ${clicks})`, msgReturn);
        });

        document.getElementById('cake-scene').addEventListener('click', (e) => {
            e.stopPropagation();
            if(!localStorage.getItem(CONFIG.wishStorageKey)) {
                document.getElementById('wish-modal').classList.add('active');
                trackAction("Tương tác", "Click Bánh kem (Chưa ước)", "Mở bảng điền điều ước");
            }
            else {
                popMsg(this, e, '#f9e5a5', "Bé đã gửi điều ước rồi. Ngôi sao của bé đang sáng ngay bên trên kìa.");
                trackAction("Tương tác", "Click Bánh kem (Đã ước)", "Thông báo đã ước");
            }
        });

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function showStarMessage() {
            document.getElementById('star-message-content').innerText = CONFIG.starMessages[MathUtils.randInt(0, CONFIG.starMessages.length-1)];
            let modal = document.getElementById('star-message-modal');
            modal.style.top = MathUtils.rand(20, 70) + '%'; modal.style.left = MathUtils.rand(10, 50) + '%';
            modal.classList.add('active'); setTimeout(() => modal.classList.remove('active'), 3000);
        }

        function submitWish() {
            let val = document.getElementById('wish-textarea').value.trim(); if(!val) return;
            localStorage.setItem(CONFIG.wishStorageKey, val); closeModal('wish-modal');
            
            trackAction("HÀNH ĐỘNG CHÍNH", "Đã gửi ĐIỀU ƯỚC", `Nội dung: ${val}`);

            let rect = document.getElementById('cake-scene').getBoundingClientRect();
            for(let i=0; i<30; i++) particles.push(new Particle(rect.left + rect.width/2, rect.top, '#f9e5a5', 0));
            setTimeout(revealWishStar, 1000); setTimeout(startFinale, 3000);
        }

        function revealWishStar() {
            let ws = document.getElementById('wish-star'); ws.style.display = 'block';
            ws.addEventListener('click', (e) => {
                popMsg(this, e, '#f9e5a5', "Điều ước của bé: \n\n" + localStorage.getItem(CONFIG.wishStorageKey));
                trackAction("Xem lại điều ước", "Click Sao điều ước", "Đọc lại lời ước");
            });
        }

        function startFinale() {
            if(State.finaleTriggered) return; State.finaleTriggered = true;
            
            let speech = document.getElementById('main-mascot-speech'); 
            speech.innerText = "chuẩn bị nè!"; 
            speech.style.opacity = 1;
            
            setTimeout(() => {
                speech.style.opacity = 0; 
                
                let ui = document.getElementById('finale-ui');
                document.getElementById('finale-name').innerText = CONFIG.birthdayText + "\n" + CONFIG.herName;
                document.getElementById('finale-msg').innerText = CONFIG.finalMessage;
                ui.style.display = 'block'; setTimeout(() => ui.style.opacity = 1, 100);
                
                trackAction("Hoàn thành", "Bước vào hồi kết", "Pháo hoa bắn rợp trời");
                launchFinaleFireworks(); 
                
                // GIẢN CÁCH THỜI GIAN BẮN PHÁO HOA ĐỂ GIẢM LAG MÁY (Từ 0.8s lên 1.5s)
                setInterval(launchFirework, 1500); 
                // ĐÃ XÓA setInterval(spawnFragment, 1000) Ở ĐÂY ĐỂ KHÔNG BỊ LẶP CHỒNG SAO BĂNG
            }, 3000);
        }

        function launchFinaleFireworks() { for(let i=0; i<5; i++) setTimeout(launchFirework, i*200); }

        window.onload = () => { initApp(); if(localStorage.getItem(CONFIG.wishStorageKey)) revealWishStar(); };
    </script>
</body>
