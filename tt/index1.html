<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Caro Đôi Lứa 💕 — Chơi Cùng Người Yêu</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-romantic: #120817;
      --x-color: #38bdf8;
      --o-color: #fb7185;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    input {
      user-select: text;
      -webkit-user-select: text;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-romantic);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(244, 114, 182, 0.16), transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(192, 132, 252, 0.16), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(251, 113, 133, 0.08), transparent 55%);
      color: #fdf2f8;
      overflow: hidden;
      height: 100dvh;
      width: 100vw;
    }

    /* Glassmorphism panels */
    .glass-panel {
      background: rgba(31, 16, 39, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(244, 114, 182, 0.16);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .glass-card {
      background: rgba(46, 23, 58, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(244, 114, 182, 0.14);
    }

    .active-turn-self {
      border-color: rgba(244, 114, 182, 0.8) !important;
      box-shadow: 0 0 22px rgba(244, 114, 182, 0.28), inset 0 0 12px rgba(244, 114, 182, 0.12);
    }

    .active-turn-opp {
      border-color: rgba(192, 132, 252, 0.75) !important;
      box-shadow: 0 0 22px rgba(192, 132, 252, 0.25), inset 0 0 12px rgba(192, 132, 252, 0.12);
    }

    .cheat-active-btn {
      background: linear-gradient(135deg, #f43f5e, #a855f7) !important;
      color: #ffffff !important;
      border-color: rgba(255, 255, 255, 0.4) !important;
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.55);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(244, 114, 182, 0.3);
      border-radius: 9999px;
    }

    /* Floating Chat Bubble & Emoji Animation */
    @keyframes floatUpBubble {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.8);
      }
      12% {
        opacity: 1;
        transform: translateY(0px) scale(1.03);
      }
      24% {
        transform: translateY(-6px) scale(1);
      }
      85% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-65px) scale(0.95);
      }
    }

    .floating-bubble {
      animation: floatUpBubble 4.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      pointer-events: none;
    }

    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }

    .heart-beat {
      animation: pulseHeart 1.4s infinite ease-in-out;
    }

    canvas {
      touch-action: none;
    }
  </style>
</head>
<body class="flex flex-col lg:flex-row h-full w-full p-2 sm:p-3 gap-2.5 overflow-hidden">

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed top-3 right-3 z-50 flex flex-col gap-2 max-w-xs w-full pointer-events-none"></div>

  <!-- Floating Reaction & Chat Bubble Stage -->
  <div id="floatingStage" class="fixed inset-0 pointer-events-none z-40 overflow-hidden"></div>

  <!-- SIDEBAR: Minimalist Couple Controls -->
  <aside class="w-full lg:w-[340px] xl:w-[360px] flex flex-col gap-2 shrink-0 z-20 max-h-[45dvh] lg:max-h-full overflow-y-auto lg:overflow-visible">
    
    <!-- 1. Compact Header & Connection Bar -->
    <div class="glass-panel rounded-2xl p-3 flex flex-col gap-2.5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-pink-500/30 to-purple-500/30 border border-pink-400/30 flex items-center justify-center">
            <span class="text-base heart-beat">💕</span>
          </div>

          </span>
        </div>

        <div class="flex items-center gap-1.5">
          <!-- Connection Status Pill -->
          <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full glass-card text-[11px] font-semibold">

            <i data-lucide="volume-2" class="w-4 h-4 text-pink-300" id="soundIcon"></i>
          </button>
        </div>
      </div>

      <!-- Invite Link & Connect Row (Hidden automatically once connected) -->
      <div id="connectBox" class="flex flex-col gap-2 pt-1 border-t border-pink-500/10">
        <div class="flex items-center gap-1.5">
          <button onclick="copyInviteLink()" class="flex-1 py-2 px-3 rounded-xl bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-400 hover:to-rose-400 text-white font-bold text-xs shadow-lg shadow-pink-500/25 flex items-center justify-center gap-1.5 transition active:scale-95">
            <i data-lucide="link" class="w-3.5 h-3.5"></i>
            <span>Sao chép link</span>
          </button>
          <button onclick="copyRoomCodeOnly()" class="py-2 px-2.5 rounded-xl glass-card hover:bg-pink-500/20 text-pink-200 font-semibold text-xs flex items-center gap-1 transition active:scale-95" title="Sao chép mã phòng">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
            <span>Mã</span>
          </button>
        </div>

        <div class="flex items-center gap-1.5">
          <input id="remotePeerIdInput" type="text" placeholder="Dán link hoặc mã của người ấy..."
            class="w-full text-xs bg-black/35 text-pink-100 placeholder-pink-300/40 px-3 py-2 rounded-xl border border-pink-400/20 focus:outline-none focus:border-pink-400" />
          <button onclick="connectToPeer()" class="shrink-0 px-3.5 py-2 rounded-xl bg-purple-500/30 hover:bg-purple-500/45 text-purple-100 border border-purple-400/40 font-bold text-xs transition active:scale-95">
            Kết nối
          </button>
        </div>
      </div>

      <!-- Connected Bar (Shown when connected) -->
      <div id="connectedBar" class="hidden items-center justify-between pt-1 border-t border-pink-500/10 text-xs">
        <span class="text-emerald-300 font-semibold flex items-center gap-1.5">
          <i data-lucide="heart-handshake" class="w-4 h-4 text-pink-400"></i>
          <span>Đã kết nối với người ấy</span>
        </span>
        <button onclick="disconnectPeer()" class="px-2.5 py-1 rounded-lg bg-rose-500/20 hover:bg-rose-500/30 text-rose-200 text-[11px] font-semibold transition">

    </div>

    <!-- 2. Couple Scoreboard & Action Buttons (Ván mới + Ăn gian) -->
    <div class="glass-panel rounded-2xl p-3 flex flex-col gap-2.5">
      <div class="grid grid-cols-7 items-center gap-1.5">
        <!-- Self Player -->
        <div id="cardSelf" class="col-span-3 glass-card rounded-xl p-2 transition-all duration-300 flex flex-col">
          <div class="flex items-center justify-between">
            <span id="selfTurnStatus" class="text-[10px] font-bold text-pink-300 truncate">Lượt bạn 💕</span>
            <span id="selfSymbolBadge" class="w-5 h-5 rounded-md bg-sky-500/20 border border-sky-400/40 text-sky-300 font-extrabold text-[11px] flex items-center justify-center">X</span>
          </div>
          <input id="inputSelfName" type="text" maxlength="14" value="Anh ❤️" onchange="updateSelfName()"
            class="w-full bg-transparent text-xs sm:text-sm font-bold text-white focus:outline-none focus:bg-black/30 rounded px-1 mt-1 truncate" />

        <!-- Score Center -->

            <span id="scoreSelf" class="text-sky-400">0</span>
            <span class="text-pink-400/60 text-xs">:</span>
            <span id="scoreOpponent" class="text-rose-400">0</span>
          </div>
          <span class="text-[10px] text-pink-300/60 font-bold">Ván <span id="roundNumText">1</span></span>
        </div>

        <!-- Partner Player -->
        <div id="cardOpponent" class="col-span-3 glass-card rounded-xl p-2 transition-all duration-300 flex flex-col text-right">

            <span id="oppSymbolBadge" class="w-5 h-5 rounded-md bg-rose-500/20 border border-rose-400/40 text-rose-300 font-extrabold text-[11px] flex items-center justify-center">O</span>

      <div class="grid grid-cols-2 gap-2 pt-0.5">
        <button id="btnCheatToggle" onclick="toggleCheatMode()" class="py-2 px-3 rounded-xl glass-card hover:bg-pink-500/15 text-pink-200 font-bold text-xs flex items-center justify-center gap-1.5 transition active:scale-95">
          <span>😈</span>
          <span id="cheatBtnLabel">Ăn gian: Tắt</span>
        </button>

        <button onclick="requestNewRound()" class="py-2 px-3 rounded-xl bg-gradient-to-r from-pink-500 to-purple-500 hover:from-pink-400 hover:to-purple-400 text-white font-bold text-xs shadow-lg shadow-pink-500/20 flex items-center justify-center gap-1.5 transition active:scale-95">
          <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
          <span>Ván mới</span>
        </button>
      </div>
    </div>

    <!-- 3. Custom Real-Time Text Chat -->
    <div class="glass-panel rounded-2xl p-3 flex-1 flex flex-col gap-2 min-h-[130px] lg:min-h-0 overflow-hidden">
      <!-- Quick Love Reactions + Clear Label -->
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-pink-200 flex items-center gap-1">
          <i data-lucide="message-circle-heart" class="w-3.5 h-3.5 text-pink-400"></i>
          <span>Nhắn tin</span>
        </span>
        <div class="flex items-center gap-1">
          <button onclick="sendQuickReaction('❤️')" class="hover:scale-125 transition text-sm px-1">❤️</button>

          <button onclick="sendQuickReaction('😈')" class="hover:scale-125 transition text-sm px-1">😈</button>
          <button onclick="sendQuickReaction('🌷')" class="hover:scale-125 transition text-sm px-1">🌷</button>

      </div>

      <!-- Chat History -->
      <div id="chatMessages" class="flex-1 overflow-y-auto space-y-1.5 pr-1 text-xs flex flex-col justify-end">
        <div class="text-pink-200/70 bg-pink-500/10 rounded-xl px-2.5 py-1.5 border border-pink-400/15 text-[11px]">
          💌 Bấm <b>Sao chép link</b> gửi cho người yêu để vào chơi ngay nhé!
        </div>
      </div>

      <!-- Free Text Input -->
      <form onsubmit="handleChatSubmit(event)" class="flex items-center gap-1.5">
        <input id="chatInput" type="text" maxlength="150" placeholder="Nhập tin nhắn..."

        <button type="submit" class="shrink-0 px-3 py-2 rounded-xl bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold text-xs transition active:scale-95 flex items-center gap-1">
          <span>Gửi</span>
        </button>

    </div>

  </aside>

  <!-- MAIN AREA: Interactive Board -->
  <main class="flex-1 glass-panel rounded-2xl relative overflow-hidden flex flex-col min-h-[52dvh]">
    
    <!-- Minimalist Top HUD on Board -->
    <div class="absolute top-3 left-3 right-3 z-10 flex items-center justify-between pointer-events-none gap-2">
      <div class="pointer-events-auto glass-panel px-3.5 py-1.5 rounded-xl flex items-center gap-2 border border-pink-400/30">
        <span id="hudTurnIndicator" class="w-2.5 h-2.5 rounded-full bg-sky-400 shadow-[0_0_8px_#38bdf8]"></span>
        <span id="hudTurnText" class="text-xs sm:text-sm font-bold text-white">Lượt bạn</span>
        <span id="cheatActiveBadge" class="hidden text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-500/30 text-rose-200 border border-rose-400/40">

      <!-- Zoom Controls -->

        <button onclick="zoomBoard(1.18)" class="p-1.5 rounded-lg hover:bg-pink-500/20 text-pink-100 transition active:scale-95" title="Phóng to">

        <button onclick="zoomBoard(0.85)" class="p-1.5 rounded-lg hover:bg-pink-500/20 text-pink-100 transition active:scale-95" title="Thu nhỏ">

        <button onclick="centerBoardView()" class="p-1.5 rounded-lg hover:bg-pink-500/20 text-pink-300 transition active:scale-95" title="Căn giữa">

    <!-- Canvas Container -->
    <div id="canvasContainer" class="w-full h-full flex-1 relative cursor-crosshair overflow-hidden">
      <canvas id="gomokuCanvas" class="block w-full h-full"></canvas>
    </div>

    <!-- Victory Modal -->
    <div id="victoryModal" class="hidden absolute inset-0 z-30 bg-black/65 backdrop-blur-md flex items-center justify-center p-4">
      <div class="glass-panel rounded-3xl p-6 max-w-sm w-full border border-pink-400/30 shadow-2xl text-center flex flex-col items-center gap-4">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-pink-500/30 to-purple-500/30 border border-pink-400/40 flex items-center justify-center text-3xl shadow-lg heart-beat">
          👑
        </div>

        <div>
          <h2 id="victoryTitle" class="text-xl sm:text-2xl font-extrabold text-white">Chiến Thắng!</h2>
          <p id="victorySubtitle" class="text-xs text-pink-200/80 mt-1">+1 điểm yêu thương 💕</p>
        </div>

        <div class="w-full glass-card rounded-2xl p-3 flex items-center justify-around">
          <div class="flex flex-col items-center">
            <span id="modalNameSelf" class="text-xs text-pink-200 truncate max-w-[100px]">Anh ❤️</span>
            <span id="modalScoreSelf" class="text-2xl font-extrabold text-sky-400">1</span>
          </div>
          <span class="text-sm">💞</span>
          <div class="flex flex-col items-center">
            <span id="modalNameOpp" class="text-xs text-pink-200 truncate max-w-[100px]">Em 🌷</span>
            <span id="modalScoreOpp" class="text-2xl font-extrabold text-rose-400">0</span>
          </div>
        </div>

        <div class="flex items-center gap-2 w-full">
          <button onclick="hideVictoryModalOnly()" class="flex-1 py-2.5 px-3 rounded-xl glass-card hover:bg-pink-500/20 text-pink-100 font-semibold text-xs transition">
            Xem bàn cờ
          </button>
          <button onclick="requestNewRound()" class="flex-1 py-2.5 px-3 rounded-xl bg-gradient-to-r from-pink-500 to-purple-500 text-white font-extrabold text-xs shadow-lg shadow-pink-500/25 transition">
            Chơi tiếp 💕
          </button>
        </div>
      </div>
    </div>

  </main>

  <script>
    /**************************************************************
     * 1. SOUND EFFECTS (WEB AUDIO API)
     **************************************************************/
    let audioCtx = null;
    let soundEnabled = true;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const iconEl = document.getElementById('soundIcon');
      if (iconEl) {
        iconEl.setAttribute('data-lucide', soundEnabled ? 'volume-2' : 'volume-x');
        iconEl.className = soundEnabled ? 'w-4 h-4 text-pink-300' : 'w-4 h-4 text-pink-300/40';
        lucide.createIcons();
      }
      if (soundEnabled) playTone('pop');
    }

    function playTone(type) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'moveX' || type === 'moveO') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type === 'moveX' ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(type === 'moveX' ? 540 : 440, now);
          osc.frequency.exponentialRampToValueAtTime(type === 'moveX' ? 880 : 680, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'connect') {
          [523.25, 659.25, 783.99].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.15, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.26);
          });
        } else if (type === 'win') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            gain.gain.setValueAtTime(0.22, now + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + 0.42);
          });
        } else if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(680, now);
          osc.frequency.exponentialRampToValueAtTime(1020, now + 0.07);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        }
      } catch (e) {}
    }

    /**************************************************************
     * 2. GAME STATE & CHEAT MODE CONFIGURATION
     **************************************************************/
    const BOARD_SIZE = 22;
    let board = [];
    let moveHistory = [];
    let winningLine = null;
    let gameOver = false;

    let mySymbol = 'X';
    let currentTurn = 'X';
    let roundStarter = 'X';
    let roundNumber = 1;

    // Cheat Mode ("Ăn gian"): When enabled during your turn, your move doesn't end your turn
    let isCheatMode = false;

    let scores = { self: 0, opponent: 0 };
    let selfName = 'Anh ❤️';
    let opponentName = 'Em 🌷';
    let hasEditedName = false;

    let peer = null;
    let conn = null;
    let myPeerId = '';
    let isOnlineConnected = false;

    // Canvas Viewport
    const canvas = document.getElementById('gomokuCanvas');
    const ctx = canvas.getContext('2d');
    let cellSize = 40;
    let zoomScale = 1.0;
    let panX = 0;
    let panY = 0;
    let hoverCell = null;
    let isDragging = false;
    let dragMovedDistance = 0;

    let heartParticles = [];
    let animPhase = 0;

    function createEmptyBoard() {
      const b = [];
      for (let r = 0; r < BOARD_SIZE; r++) {
        b.push(new Array(BOARD_SIZE).fill(null));
      }
      return b;
    }

    /**************************************************************
     * 3. PEERJS & AUTO-INVITE LINK (?room=...)
     **************************************************************/
    function initPeerConnection() {
      if (peer) {
        try { peer.destroy(); } catch (err) {}
      }

      updateConnectionStatusUI('connecting', 'Đang mở...');

      // MANDATORY TURN/STUN CONFIGURATION
      peer = new Peer({
        pingInterval: 5000,
        config: {
          iceServers: [
            { urls: "stun:stun.relay.metered.ca:80" },
            {
              urls: "turn:global.relay.metered.ca:80",
              username: "d32fd3b7a21cd5272913dc5b",
              credential: "xJv65cmRK3CKvT1F",
            },
            {
              urls: "turn:global.relay.metered.ca:80?transport=tcp",
              username: "d32fd3b7a21cd5272913dc5b",
              credential: "xJv65cmRK3CKvT1F",

    // Extract Peer ID whether user pasted a full URL (?room=xyz) or raw ID
    function extractPeerId(rawInput) {
      const trimmed = (rawInput || '').trim();
      if (!trimmed) return '';
      try {
        if (trimmed.includes('?room=') || trimmed.startsWith('http')) {
          const url = new URL(trimmed);
          const roomId = url.searchParams.get('room');
          if (roomId) return roomId.trim();
        }
      } catch (e) {
        const match = trimmed.match(/[?&]room=([^&#]+)/);
        if (match && match[1]) return decodeURIComponent(match[1]).trim();
      }
      return trimmed;
    }

    function handleIncomingP2PData(data) {
      if (!data || !data.type) return;

      switch (data.type) {
        case 'BUSY':
          showToast('Phòng đang bận mất rồi!', 'error');
          disconnectPeer();
          break;

        case 'HANDSHAKE':
          opponentName = data.name || 'Người ấy 💕';
          updateScoreboardAndTurnUI();
          break;

        case 'NAME_UPDATE':
          opponentName = data.name || 'Người ấy 💕';
          updateScoreboardAndTurnUI();
          break;

        case 'MOVE':
          applyMoveOnBoard(data.r, data.c, data.symbol, false, Boolean(data.extraTurn));
          break;

        case 'NEW_ROUND':
          roundNumber = data.roundNumber;
          roundStarter = data.roundStarter;
          startRound(false);
          showToast(`Ván #${roundNumber} bắt đầu!`, 'info');
          break;

        case 'CHAT':
          playTone('pop');
          appendChatMessage(opponentName, data.text, 'opponent');
          spawnFloatingBubble(opponentName, data.text, false);
          break;

        case 'REACTION':
          playTone('pop');
          spawnFloatingBubble(opponentName, data.emoji, true);
          break;
      }
    }

    async function copyTextReliable(textToCopy) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(textToCopy);
          return true;
        } catch (err) {}
      }
      // Fallback textarea + execCommand for iframes/WebViews
      const ta = document.createElement('textarea');
      ta.value = textToCopy;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;
      try {
        ok = document.execCommand('copy');
      } catch (e) {
        ok = false;
      }
      document.body.removeChild(ta);
      return ok;
    }

    function handleBoardClick(r, c) {
      if (gameOver) {
        showToast('Ván đấu đã xong! Bấm "Ván mới" nhé 💕', 'info');
        return;
      }
      if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE) return;
      if (board[r][c] !== null) return;

      if (isOnlineConnected) {
        if (currentTurn !== mySymbol) {
          showToast('Đợi người ấy đánh xong đã nhé 🥺', 'info');
          return;
        }
        applyMoveOnBoard(r, c, mySymbol, true, isCheatMode);
      } else {
        // Offline practice mode on same device
        applyMoveOnBoard(r, c, currentTurn, false, isCheatMode);
      }
    }

    function applyMoveOnBoard(r, c, symbol, isLocalAction, keepExtraTurn = false) {
      if (board[r][c] !== null || gameOver) return;

      board[r][c] = symbol;
      moveHistory.push({ r, c, symbol });

      playTone(symbol === 'X' ? 'moveX' : 'moveO');

      if (isLocalAction && isOnlineConnected) {
        sendP2PMessage({
          type: 'MOVE',
          r,
          c,
          symbol,
          extraTurn: keepExtraTurn
        });
      }

      // Check 5-in-a-row win
      const winCells = checkFiveInARow(r, c, symbol);
      if (winCells) {
        winningLine = winCells;
        gameOver = true;

        const isSelfWinner = isOnlineConnected ? (symbol === mySymbol) : (symbol === 'X');
        if (isSelfWinner) {
          scores.self++;
        } else {
          scores.opponent++;
        }

        playTone('win');
        spawnHeartConfetti();
        updateScoreboardAndTurnUI();

        setTimeout(() => {
          showVictoryModal(symbol, isSelfWinner);
        }, 600);
        return;
      }

      if (moveHistory.length >= BOARD_SIZE * BOARD_SIZE) {
        gameOver = true;
        showToast('Hòa nhau rồi! Cả hai đều giỏi 💕', 'info');
        return;
      }

      // If Cheat Mode ("Ăn gian") was active on this move, DO NOT switch currentTurn!
      if (keepExtraTurn) {
        currentTurn = symbol;
        if (!isLocalAction) {
          spawnFloatingBubble(opponentName, 'Lêu lêu ăn gian thêm lượt 😈', false);
        }
      } else {
        currentTurn = (symbol === 'X') ? 'O' : 'X';
      }

      updateScoreboardAndTurnUI();
    }

    function checkFiveInARow(lastR, lastC, symbol) {
      const directions = [
        [0, 1],
        [1, 0],
        [1, 1],
        [1, -1]
      ];

      for (const [dr, dc] of directions) {
        const line = [{ r: lastR, c: lastC }];

        let nr = lastR + dr;
        let nc = lastC + dc;
        while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === symbol) {
          line.push({ r: nr, c: nc });
          nr += dr;
          nc += dc;
        }

        nr = lastR - dr;
        nc = lastC - dc;
        while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === symbol) {
          line.unshift({ r: nr, c: nc });
          nr -= dr;
          nc -= dc;
        }

        if (line.length >= 5) return line;
      }
      return null;
    }

    /**************************************************************
     * 7. CANVAS BOARD RENDERER & HEART CONFETTI
     **************************************************************/
    function resizeCanvas() {
      const container = document.getElementById('canvasContainer');
      if (!container) return;
      const dpr = window.devicePixelRatio || 1;
      const rect = container.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function centerBoardView() {
      const container = document.getElementById('canvasContainer');
      if (!container) return;
      const rect = container.getBoundingClientRect();
      zoomScale = rect.width < 640 ? 0.85 : 1.0;
      const totalBoardPx = BOARD_SIZE * cellSize * zoomScale;
      panX = (rect.width - totalBoardPx) / 2;
      panY = (rect.height - totalBoardPx) / 2;
    }

    function zoomBoard(factor) {
      const container = document.getElementById('canvasContainer');
      const rect = container.getBoundingClientRect();
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;

      const newZoom = Math.min(2.2, Math.max(0.55, zoomScale * factor));
      const scaleChange = newZoom / zoomScale;

      panX = centerX - (centerX - panX) * scaleChange;
      panY = centerY - (centerY - panY) * scaleChange;
      zoomScale = newZoom;
    }

    function screenToBoardCell(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const x = clientX - rect.left - panX;
      const y = clientY - rect.top - panY;
      const scaledCell = cellSize * zoomScale;
      const c = Math.floor(x / scaledCell);
      const r = Math.floor(y / scaledCell);
      if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE) {
        return { r, c };
      }
      return null;
    }

    function initCanvasInteractions() {
      let activePointers = new Map();
      let initialPinchDist = null;
      let initialZoom = 1;

      canvas.addEventListener('pointerdown', (e) => {
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (activePointers.size === 1) {
          isDragging = true;
          dragMovedDistance = 0;
        } else if (activePointers.size === 2) {
          const pts = Array.from(activePointers.values());
          initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          initialZoom = zoomScale;
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (e.target === canvas) {
          hoverCell = screenToBoardCell(e.clientX, e.clientY);
        } else {
          hoverCell = null;
        }

        if (!activePointers.has(e.pointerId)) return;
        const prev = activePointers.get(e.pointerId);
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (activePointers.size === 2 && initialPinchDist) {
          const pts = Array.from(activePointers.values());
          const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          if (dist > 10) {
            zoomScale = Math.min(2.2, Math.max(0.55, initialZoom * (dist / initialPinchDist)));
          }
          dragMovedDistance = 999;
          return;
        }

        if (isDragging && activePointers.size === 1) {
          const dx = e.clientX - prev.x;
          const dy = e.clientY - prev.y;
          panX += dx;
          panY += dy;
          dragMovedDistance += Math.hypot(dx, dy);
        }
      });

      window.addEventListener('pointerup', (e) => {
        activePointers.delete(e.pointerId);
        if (activePointers.size < 2) initialPinchDist = null;

        if (isDragging && activePointers.size === 0) {
          isDragging = false;
          if (dragMovedDistance < 8 && e.target === canvas) {
            const cell = screenToBoardCell(e.clientX, e.clientY);
            if (cell) handleBoardClick(cell.r, cell.c);
          }
        }
      });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.1 : 0.9;
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const newZoom = Math.min(2.2, Math.max(0.55, zoomScale * factor));
        const scaleChange = newZoom / zoomScale;

        panX = mouseX - (mouseX - panX) * scaleChange;
        panY = mouseY - (mouseY - panY) * scaleChange;
        zoomScale = newZoom;
      }, { passive: false });
    }

    function spawnHeartConfetti() {
      const container = document.getElementById('canvasContainer');
      const rect = container.getBoundingClientRect();
      const hearts = ['❤️', '💖', '💕', '🌸', '✨'];
      heartParticles = [];
      for (let i = 0; i < 45; i++) {
        heartParticles.push({
          x: rect.width / 2 + (Math.random() - 0.5) * 180,
          y: rect.height / 2 + (Math.random() - 0.5) * 100,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.85) * 8 - 2,
          size: 16 + Math.random() * 12,
          char: hearts[Math.floor(Math.random() * hearts.length)],
          alpha: 1
        });
      }
    }

    function renderLoop() {
      animPhase += 0.06;
      const container = document.getElementById('canvasContainer');
      const width = container.clientWidth;
      const height = container.clientHeight;

      ctx.clearRect(0, 0, width, height);

      const sCell = cellSize * zoomScale;
      const boardPx = BOARD_SIZE * sCell;

      ctx.save();
      ctx.translate(panX, panY);

      // Board background
      ctx.fillStyle = 'rgba(26, 12, 34, 0.85)';
      ctx.strokeStyle = 'rgba(244, 114, 182, 0.28)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(-16 * zoomScale, -16 * zoomScale, boardPx + 32 * zoomScale, boardPx + 32 * zoomScale, 14 * zoomScale);
      ctx.fill();
      ctx.stroke();

      // Hover cell preview
      if (hoverCell && !gameOver && board[hoverCell.r][hoverCell.c] === null) {
        const canPreview = !isOnlineConnected || (currentTurn === mySymbol);
        if (canPreview) {
          ctx.fillStyle = currentTurn === 'X' ? 'rgba(56, 189, 248, 0.12)' : 'rgba(251, 113, 133, 0.12)';
          ctx.fillRect(hoverCell.c * sCell + 1, hoverCell.r * sCell + 1, sCell - 2, sCell - 2);
        }
      }

      // Highlight Last Move
      if (moveHistory.length > 0) {
        const last = moveHistory[moveHistory.length - 1];
        const lx = last.c * sCell;
        const ly = last.r * sCell;
        const pulseAlpha = 0.2 + Math.sin(animPhase * 2) * 0.08;
        ctx.fillStyle = last.symbol === 'X'
          ? `rgba(56, 189, 248, ${pulseAlpha})`
          : `rgba(251, 113, 133, ${pulseAlpha})`;
        ctx.fillRect(lx + 1, ly + 1, sCell - 2, sCell - 2);

        ctx.strokeStyle = last.symbol === 'X' ? '#38bdf8' : '#fb7185';
        ctx.lineWidth = 2 * zoomScale;
        ctx.strokeRect(lx + 2, ly + 2, sCell - 4, sCell - 4);
      }

      // Grid lines
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(244, 114, 182, 0.14)';
      for (let i = 0; i <= BOARD_SIZE; i++) {
        const pos = i * sCell;
        ctx.beginPath();
        ctx.moveTo(0, pos);
        ctx.lineTo(boardPx, pos);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(pos, 0);
        ctx.lineTo(pos, boardPx);
        ctx.stroke();
      }

      // Ghost Piece on Hover
      if (hoverCell && !gameOver && board[hoverCell.r][hoverCell.c] === null) {
        const canPreview = !isOnlineConnected || (currentTurn === mySymbol);
        if (canPreview) {
          ctx.save();
          ctx.globalAlpha = 0.35;
          drawPiece(hoverCell.r, hoverCell.c, currentTurn, sCell);
          ctx.restore();
        }
      }

      // Draw All Pieces
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (board[r][c]) {
            drawPiece(r, c, board[r][c], sCell);
          }
        }
      }

      // Draw Winning 5-in-a-row Line
      if (winningLine && winningLine.length >= 5) {
        const first = winningLine[0];
        const last = winningLine[winningLine.length - 1];
        const x1 = first.c * sCell + sCell / 2;
        const y1 = first.r * sCell + sCell / 2;
        const x2 = last.c * sCell + sCell / 2;
        const y2 = last.r * sCell + sCell / 2;
        const winSym = board[first.r][first.c];

        winningLine.forEach(cell => {
          ctx.fillStyle = winSym === 'X' ? 'rgba(56, 189, 248, 0.25)' : 'rgba(251, 113, 133, 0.25)';
          ctx.fillRect(cell.c * sCell + 2, cell.r * sCell + 2, sCell - 4, sCell - 4);
        });

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineCap = 'round';
        ctx.lineWidth = (6 + Math.sin(animPhase * 3) * 1.5) * zoomScale;
        ctx.strokeStyle = '#ffffff';
        ctx.shadowColor = winSym === 'X' ? '#38bdf8' : '#fb7185';
        ctx.shadowBlur = 22;
        ctx.stroke();
        ctx.restore();
      }

      ctx.restore();

      // Heart Confetti
      if (heartParticles.length > 0) {
        for (let i = heartParticles.length - 1; i >= 0; i--) {
          const p = heartParticles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.15;
          p.alpha -= 0.009;

          if (p.alpha <= 0) {
            heartParticles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.font = `${Math.floor(p.size)}px sans-serif`;
          ctx.fillText(p.char, p.x, p.y);
          ctx.restore();
        }
      }

      requestAnimationFrame(renderLoop);
    }

    function drawPiece(r, c, symbol, sCell) {
      const cx = c * sCell + sCell / 2;
      const cy = r * sCell + sCell / 2;
      const radius = sCell * 0.31;

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(2.5, 3.6 * zoomScale);

      if (symbol === 'X') {
        ctx.strokeStyle = '#38bdf8';
        ctx.shadowColor = 'rgba(56, 189, 248, 0.75)';
        ctx.shadowBlur = 10 * zoomScale;

        ctx.beginPath();
        ctx.moveTo(cx - radius, cy - radius);
        ctx.lineTo(cx + radius, cy + radius);
        ctx.moveTo(cx + radius, cy - radius);
        ctx.lineTo(cx - radius, cy + radius);
        ctx.stroke();
      } else {
        ctx.strokeStyle = '#fb7185';
        ctx.shadowColor = 'rgba(251, 113, 133, 0.75)';
        ctx.shadowBlur = 10 * zoomScale;

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    /**************************************************************
     * 8. CUSTOM TEXT CHAT & FLOATING MESSAGE BUBBLES
     **************************************************************/
    function handleChatSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = (input.value || '').trim();
      if (!text) return;

      input.value = '';
      playTone('pop');
      appendChatMessage(selfName, text, 'self');
      spawnFloatingBubble(selfName, text, false);

      if (isOnlineConnected) {
        sendP2PMessage({
          type: 'CHAT',
          text
        });
      }
    }

    function appendChatMessage(sender, text, role) {
      const box = document.getElementById('chatMessages');
      if (!box) return;

      const msgDiv = document.createElement('div');
      if (role === 'self') {
        msgDiv.className = 'bg-pink-500/20 border border-pink-400/30 rounded-xl px-2.5 py-1.5 self-end max-w-[92%] break-words';
        msgDiv.innerHTML = `<span class="font-bold text-pink-300 text-[11px]">${escapeHtml(sender)}:</span> <span class="text-white">${escapeHtml(text)}</span>`;
      } else {
        msgDiv.className = 'bg-purple-500/20 border border-purple-400/30 rounded-xl px-2.5 py-1.5 self-start max-w-[92%] break-words';
        msgDiv.innerHTML = `<span class="font-bold text-purple-300 text-[11px]">${escapeHtml(sender)}:</span> <span class="text-white">${escapeHtml(text)}</span>`;
      }

      box.appendChild(msgDiv);
      box.scrollTop = box.scrollHeight;
    }

    function sendQuickReaction(emoji) {
      playTone('pop');
      spawnFloatingBubble(selfName, emoji, true);
      if (isOnlineConnected) {
        sendP2PMessage({
          type: 'REACTION',
          emoji
        });
      }
    }

    function spawnFloatingBubble(senderName, content, isBigEmoji = false) {
      const stage = document.getElementById('floatingStage');
      if (!stage) return;

      const el = document.createElement('div');
      const randomLeft = 25 + Math.random() * 50;
      el.style.left = `${randomLeft}%`;
      el.style.bottom = '14%';
      el.className = 'floating-bubble fixed -translate-x-1/2 flex flex-col items-center max-w-[260px] text-center';

      if (isBigEmoji) {
        el.innerHTML = `
          <div class="text-4xl sm:text-5xl drop-shadow-[0_6px_16px_rgba(0,0,0,0.5)]">${escapeHtml(content)}</div>
          <span class="mt-1 px-2.5 py-0.5 rounded-full bg-black/75 border border-pink-400/30 text-[10px] font-bold text-pink-200">${escapeHtml(senderName)}</span>
        `;
      } else {
        el.innerHTML = `
          <div class="glass-panel px-3.5 py-2 rounded-2xl border border-pink-400/40 shadow-2xl text-xs font-semibold text-white break-words">
            <span class="text-pink-300 font-bold block text-[10px] mb-0.5">${escapeHtml(senderName)} 💕</span>
            ${escapeHtml(content)}
          </div>
        `;
      }

      stage.appendChild(el);
      setTimeout(() => el.remove(), 4200);
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;

      const toast = document.createElement('div');
      let colors = 'border-pink-400/40 bg-[#1f1027]/95 text-pink-100';
      if (type === 'success') colors = 'border-emerald-400/50 bg-[#1f1027]/95 text-emerald-200';
      if (type === 'error') colors = 'border-rose-400/50 bg-[#1f1027]/95 text-rose-200';

      toast.className = `glass-panel ${colors} border px-3 py-2 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-2 transition-all duration-300`;
      toast.innerHTML = `
        <span>${type === 'error' ? '🥺' : type === 'success' ? '💕' : '✨'}</span>
        <span>${escapeHtml(message)}</span>
      `;

      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-6px)';
        setTimeout(() => toast.remove(), 250);
      }, 2800);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /**************************************************************
     * 9. BOOTSTRAP
     **************************************************************/
    window.onload = function () {
      lucide.createIcons();
      board = createEmptyBoard();
      resizeCanvas();
      centerBoardView();
      initCanvasInteractions();
      updateScoreboardAndTurnUI();
      initPeerConnection();

      window.addEventListener('resize', resizeCanvas);
      requestAnimationFrame(renderLoop);
    };
  </script>
