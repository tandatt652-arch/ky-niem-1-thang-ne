<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logic Bẻ Lái - The Gaslight Room</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Comic Neue', cursive, sans-serif; }
        body { background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
        
        #game-wrapper {
            position: relative; width: 420px; height: 700px; background-color: #fceabb;
            border: 4px solid #000; border-radius: 20px; box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
            overflow: hidden; display: flex; flex-direction: column; transition: background 1s ease;
        }
        @media (max-width: 450px), (max-height: 750px) {
            #game-wrapper { width: 100vw; height: 100vh; border-radius: 0; border: none; box-shadow: none; }
        }

        #header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background-color: #fff; border-bottom: 4px solid #000; z-index: 100; }
        .btn { background: #fff; border: 3px solid #000; border-radius: 10px; padding: 8px 12px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 3px 3px 0px #000; transition: transform 0.1s; }
        .btn:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px #000; }
        #level-title { font-size: 24px; font-weight: bold; text-transform: uppercase; display: flex; align-items: center; gap: 5px;}

        #game-area { flex: 1; position: relative; background: #fdfbfb; display: flex; justify-content: center; align-items: center; flex-direction: column; padding: 20px; overflow: hidden; transition: background 0.4s;}
        .question-text { font-size: 19px; text-align: center; position: absolute; top: 15px; width: 92%; z-index: 10; background: rgba(255,255,255,0.9); border-radius: 10px; padding: 6px 10px; border: 2px solid #000;}

        /* Modals & Popups */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal-box { background: #fff; border: 4px solid #000; border-radius: 15px; padding: 30px; text-align: center; width: 80%; box-shadow: 8px 8px 0px #000; position: relative; }
        .close-btn { position: absolute; top: -15px; right: -15px; background: #ff4757; color: #fff; border: 3px solid #000; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; font-weight: bold; cursor: pointer; }

        @keyframes shake { 0%,100% { transform: translateX(0); } 25%,75% { transform: translateX(-10px); } 50% { transform: translateX(10px); } }
        .shake-anim { animation: shake 0.4s ease-in-out; }
        @keyframes pop { 0% { transform: scale(0.8); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .pop-anim { animation: pop 0.5s ease-out; }
        
        .confetti { position: absolute; width: 10px; height: 10px; background: red; z-index: 300; animation: fall 1.5s linear forwards; }
        @keyframes fall { to { transform: translateY(800px) rotate(720deg); opacity: 0; } }
        
        /* Hiệu ứng credits Màn 11 */
        @keyframes rollCredits { 0% { transform: translateY(100%); } 100% { transform: translateY(-200%); } }
        .credits-anim { animation: rollCredits 10s linear forwards; }

        .emoji-obj { font-size: 46px; position: absolute; cursor: pointer; filter: drop-shadow(2px 2px 0px #000); touch-action: none;}
        .hidden { display: none !important; }
        
        .l11-glow { box-shadow: 0 0 30px #f1c40f, 0 0 60px #f39c12 !important; border-color: #f1c40f !important; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="header">
        <button class="btn" id="settings-btn">⚙️</button>
        <div id="level-title">Level <span id="lv-num">1</span> <span id="title-lock" style="cursor:grab; z-index:150;">🔒</span></div>
        <div>
            <button class="btn" id="hint-btn">💡</button>
            <button class="btn" onclick="loadLevel(currentLevel)">🔄</button>
        </div>
    </div>

    <div id="game-area"></div>

    <div id="settings-modal" class="modal-overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="hideModal('settings-modal')">X</button>
            <h2>Cài đặt</h2><br>
            <div id="volume-setting" style="display:flex; justify-content:center; align-items:center; gap: 10px; margin-bottom: 10px;">
                <span style="font-size:18px; font-weight:bold;">Âm lượng: 🔊</span>
                <div id="volume-slider" style="position:relative; width:120px; height:18px; background:#ccc; border-radius:5px; border:2px solid #000; cursor:pointer;">
                    <div style="position:absolute; top:-4px; right:-2px; width:22px; height:22px; background:#fff; border:2px solid #000; border-radius:50%; pointer-events:none;"></div>
                </div>
            </div>
            <div id="settings-secret-area"></div>
        </div>
    </div>

    <div id="hint-modal" class="modal-overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="hideModal('hint-modal')">X</button>
            <h2 style="font-size: 26px;">💡 Gợi ý</h2><br>
            <p id="hint-text" style="font-size: 20px; font-weight: bold; color: #2c3e50; line-height: 1.5;"></p>
        </div>
    </div>

    <div id="result-popup" class="modal-overlay">
        <div class="modal-box" id="result-box">
            <h2 id="result-title" style="font-size: 32px;">Thắng rồi!</h2><br>
            <p id="result-message" style="font-size: 20px; font-style: italic;">Bạn giỏi quá!</p><br><br>
            <button class="btn" id="result-btn" style="background: #4cd137; color: white;">Chơi tiếp</button>
        </div>
    </div>
</div>

<script>
    // --- 1. HỆ THỐNG TRACKING FORM ---
    const SESSION_ID = 'VO_YEU_' + Math.random().toString(36).substring(2, 9).toUpperCase();
    let currentLevel = 1; // Khởi tạo Level 1
    const gameArea = document.getElementById('game-area');
    let levelState = {}; 
    let levelTimer = null;

    function sendTrackingData(questionContent, userChoice, gameReply) {
        console.log(`[Spy] ${questionContent} | ${userChoice} | ${gameReply}`);
        const GOOGLE_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSe4Jvx2uI27uJQTt9Xn6QdFj59c53kFNIRbxyFeirMOOEFE4g/formResponse';
        const formData = new FormData();
        formData.append('entry.1666228409', SESSION_ID);      
        formData.append('entry.1275903316', questionContent); 
        formData.append('entry.444679017', userChoice);       
        formData.append('entry.1158846627', gameReply);       
        fetch(GOOGLE_FORM_URL, { method: 'POST', mode: 'no-cors', body: formData }).catch(e => console.log(e));
    }

    function triggerFail(msg, action) {
        sendTrackingData(`Level ${currentLevel}`, action, `Thua: ${msg}`);
        showResult(false, msg);
    }

    function triggerWin(msg, action) {
        sendTrackingData(`Level ${currentLevel}`, action, `Thắng: ${msg}`);
        showResult(true, msg);
    }

    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function hideModal(id) { document.getElementById(id).style.display = 'none'; }

    function showResult(isWin, msg) {
        document.querySelectorAll('.modal-overlay').forEach(el => el.style.display = 'none');
        const popup = document.getElementById('result-popup');
        const title = document.getElementById('result-title');
        const message = document.getElementById('result-message');
        const btn = document.getElementById('result-btn');
        const box = document.getElementById('result-box');

        popup.style.display = 'flex';
        message.innerText = msg;
        
        if (isWin) {
            title.innerText = (currentLevel === 11) ? "ĐĂNG QUANG PHÁ ĐẢO 🏆" : "Vợ yêu giỏi quá!";
            title.style.color = "#4cd137";
            btn.innerText = (currentLevel === 11) ? "🎉 Nhận Quà 🎉" : "Màn Kế Tiếp ➡️";
            
            // Xử lý sự kiện nút next
            btn.onclick = () => { 
                hideModal('result-popup'); 
                if (currentLevel >= 11) {
                    alert("Trò chơi kết thúc! Chúc em luôn vui vẻ và hạnh phúc nha ❤️");
                    sendTrackingData("Kết thúc", "Hoàn thành game", "Đã phá đảo 11 màn");
                    currentLevel = 1; // Reset game
                    loadLevel(1);
                } else {
                    nextLevel(); 
                }
            };
            box.className = 'modal-box pop-anim';
            createConfetti();
        } else {
            title.innerText = "MẮC BẪY RỒI!";
            title.style.color = "#e84118";
            btn.innerText = "Chơi Lại 🔄";
            
            // Bẫy Level 11 Reset về Level 1
            btn.onclick = () => { 
                hideModal('result-popup'); 
                if (currentLevel === 11 && msg.includes("ngây thơ thế thì chơi lại từ đầu")) {
                    currentLevel = 11;
                    loadLevel(11);
                } else {
                    loadLevel(currentLevel); 
                }
            };
            
            box.className = 'modal-box shake-anim';
            document.getElementById('game-wrapper').classList.remove('shake-anim');
            void document.getElementById('game-wrapper').offsetWidth; 
            document.getElementById('game-wrapper').classList.add('shake-anim');
        }
    }

    function createConfetti() {
        for(let i=0; i<40; i++) {
            let conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + '%';
            conf.style.backgroundColor = ['#e84118', '#4cd137', '#fbc531', '#00a8ff', '#e056fd'][Math.floor(Math.random()*5)];
            document.getElementById('game-wrapper').appendChild(conf);
            setTimeout(() => conf.remove(), 1500);
        }
    }

    function nextLevel() {
        currentLevel++;
        loadLevel(currentLevel);
    }

    // --- ENGINE KÉO THẢ TỐI ƯU ---
    function makeDraggable(el, onDrag, onDrop, onDragStart) {
        if(!el) return;
        let isDown = false;
        el.style.touchAction = 'none';
        let startX, startY;
        let initialLeft, initialTop;

        el.onpointerdown = (e) => {
            if (onDragStart && onDragStart(e) === false) return;
            isDown = true;
            startX = e.clientX; startY = e.clientY;
            
            const stylePos = window.getComputedStyle(el).position;
            if (stylePos === 'static' || stylePos === 'relative') {
                el.style.position = 'relative';
                initialLeft = parseFloat(el.style.left) || 0;
                initialTop = parseFloat(el.style.top) || 0;
            } else {
                initialLeft = parseFloat(el.style.left) || el.offsetLeft;
                initialTop = parseFloat(el.style.top) || el.offsetTop;
                el.style.right = 'auto';
                el.style.bottom = 'auto';
            }
            el.style.zIndex = 1000;
        };

        document.addEventListener('pointermove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            let dx = e.clientX - startX; 
            let dy = e.clientY - startY;
            el.style.left = initialLeft + dx + 'px';
            el.style.top = initialTop + dy + 'px';
            if(onDrag && onDrag(e, dx, dy) === false) isDown = false;
        }, {passive: false});

        document.addEventListener('pointerup', (e) => {
            if (!isDown) return;
            isDown = false;
            el.style.zIndex = 50;
            if(onDrop) onDrop(e);
        });
    }

    function checkCollision(el1, el2, shrink1 = 0, shrink2 = 0) {
        if (!el1 || !el2) return false;
        const r1 = el1.getBoundingClientRect(); 
        const r2 = el2.getBoundingClientRect();
        return !((r1.right - shrink1) < (r2.left + shrink2) || (r1.left + shrink1) > (r2.right - shrink2) || (r1.bottom - shrink1) < (r2.top + shrink2) || (r1.top + shrink1) > (r2.bottom - shrink2));
    }

    // --- MAIN LOADER ---
    function loadLevel(level) {
        clearInterval(levelTimer);
        document.onpointerup = null; 
        document.getElementById('game-wrapper').style.backgroundColor = '#fceabb'; // Reset nền chính

        // Khôi phục thanh tiêu đề mặc định
        const lvNumContainer = document.getElementById('lv-num');
        document.getElementById('level-title').innerHTML = `Level <span id="lv-num">${level}</span> <span id="title-lock" style="cursor:grab; z-index:150; position:relative;">🔒</span>`;
        
        const lock = document.getElementById('title-lock');
        lock.style.display = (level === 2) ? 'inline-block' : 'none'; 

        // Khôi phục thanh Âm Lượng
        const volContainer = document.getElementById('volume-setting');
        const volSlider = document.getElementById('volume-slider');
        if (volSlider.parentNode !== volContainer) volContainer.appendChild(volSlider);
        volSlider.style.position = 'relative';
        volSlider.style.left = '0px';
        volSlider.style.top = '0px';
        volSlider.style.width = '120px';
        volSlider.style.height = '18px';
        volSlider.style.background = '#ccc';
        volSlider.style.opacity = '1';
        volSlider.style.zIndex = '1';
        volSlider.style.borderRadius = '5px';
        volSlider.onpointerdown = null; 

        // Khôi phục các nút Header
        document.getElementById('settings-secret-area').innerHTML = ''; 
        const settingsBtn = document.getElementById('settings-btn');
        settingsBtn.className = 'btn';
        settingsBtn.onpointerdown = null;
        settingsBtn.onclick = () => showModal('settings-modal');

        let hintBtn = document.getElementById('hint-btn');
        hintBtn.style = ""; // reset style
        hintBtn.innerText = "💡";
        hintBtn.onpointerdown = null; 
        hintBtn.onclick = () => { 
            document.getElementById('hint-text').innerText = "Hỏi chồng em nè chồng em chỉ cho"; 
            showModal('hint-modal'); 
        };

        document.getElementById('game-area').className = ''; 
        document.getElementById('game-area').style.background = '#fdfbfb';
        gameArea.innerHTML = '';
        levelState = {}; 

        sendTrackingData(`Level ${level}`, "Bắt đầu màn chơi", "Đang xử lý");

        // Gọi tắt các Level từ 1 đến 10 (mã logic bạn đã có, ở đây tôi chèn sẵn Màn 10 & 11)
        switch(level) {
            
            case 1: renderLevel11(); break;
        }
    }

    // --- CÁC HÀM TỪ MÀN 1 - 10 RÚT GỌN (Giữ nguyên logic bạn đã có) ---
   


    // =========================================================================
    // MÀN 11: LỄ ĐĂNG QUANG PHÁ ĐẢO (11 BƯỚC LOGIC CỰC KHÓ)
    // =========================================================================
    function renderLevel11() {
        levelState = {
            fps: 60, wrenchReady: false, screwsLeft: 4, cageBroken: false, 
            bladeReady: false, devGone: false,
            cdRubScore: 0, cdCleaned: false, 
            wireBroken: false, codeInjected: false, cupGlowing: false, isSafeToClick: false
        };

        document.getElementById('game-wrapper').style.backgroundColor = '#ecf0f1';

        // 1. Chế tạo tiêu đề có dấu sắc bóc được
        document.getElementById('level-title').innerHTML = `Màn Cu<span id="l11-blade" style="display:inline-block; cursor:grab; position:relative; z-index:150; font-family:sans-serif; transform: translateX(-2px) rotate(15deg); color:#c0392b;">/</span>i`;

        gameArea.innerHTML = `
            <!-- Khung viền và 4 con ốc -->
            <div id="l11-top-bar" style="position:absolute; top:0; left:0; width:100%; height:20px; background:#2c3e50; border-bottom:3px solid #000; z-index:45; transition: top 0.4s ease-in;">
                <div class="l11-screw emoji-obj" style="top:2px; left:5px; font-size:14px; margin:0;">🔩</div>
                <div class="l11-screw emoji-obj" style="top:2px; right:5px; font-size:14px; margin:0;">🔩</div>
                <div class="l11-screw emoji-obj" style="bottom:-200px; left:5px; font-size:14px; margin:0; z-index:50;">🔩</div>
                <div class="l11-screw emoji-obj" style="bottom:-200px; right:5px; font-size:14px; margin:0; z-index:50;">🔩</div>
            </div>

            <div class="question-text" style="top: 35px; z-index: 10;">
                Nhấn nút 'Phá Đảo' để nhận Cúp Vàng và kết thúc trò chơi.
            </div>

            <!-- Nút Phá Đảo Siêu To -->
            <div id="l11-btn-area" style="position:relative; margin-top:90px; z-index:20;">
                <button id="l11-giant-btn" style="width: 220px; height: 80px; background: #ff4757; color: white; border: 6px solid #c0392b; border-radius: 40px; font-size: 26px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 0 #c0392b; transition: all 0.3s;">PHÁ ĐẢO</button>
                <div id="l11-wire" class="emoji-obj" style="top:-15px; left:-10px; font-size:55px; pointer-events:none; width:110%;">🕸️⚡</div>
            </div>

            <!-- Trung tâm: Lồng kính & Cúp -->
            <div id="l11-center-stage" style="position:relative; margin-top:50px; width:150px; height:150px; display:flex; justify-content:center; align-items:center; z-index:15;">
                <div id="l11-cage" style="position:absolute; width:100%; height:100%; border:6px solid rgba(52, 152, 219, 0.6); background: rgba(52, 152, 219, 0.1); border-radius:10px; z-index:30;"></div>
                <div id="l11-cup" class="emoji-obj" style="position:relative; font-size:90px; z-index:25;">🏆
                    <div id="l11-slot" style="position:absolute; bottom:15px; left:25px; width:40px; height:6px; background:#000; border-radius:3px;"></div>
                </div>
            </div>

            <!-- Bàn làm việc Developer -->
            <div id="l11-desk" style="position:absolute; bottom:80px; right:20px; width:100px; height:120px; z-index:20;">
                <div id="l11-dev" class="emoji-obj" style="position:absolute; bottom:30px; right:0; font-size:70px; transition: transform 0.5s ease-in;">👨‍💻</div>
                <div id="l11-cable" class="emoji-obj" style="position:absolute; bottom:40px; right:-25px; font-size:35px; z-index:21;">🔌</div>
                <div id="l11-coffee" class="emoji-obj" style="position:absolute; bottom:0; left:0; font-size:45px; cursor:grab; z-index:22;">☕</div>
            </div>

            <!-- Thanh Loading dưới đáy -->
            <div id="l11-loading-container" style="position:absolute; bottom:20px; width:80%; height:25px; border:3px solid #000; border-radius:12px; background:#fff; overflow:hidden; z-index:10;">
                <div id="l11-loading-bar" style="width:10%; height:100%; background:#2ecc71; transition: width 1s ease-in;"></div>
            </div>

            <!-- Đĩa CD & FPS Text -->
            <div id="l11-cd" class="emoji-obj hidden" style="font-size:55px; z-index:60; cursor:grab;">📀💩</div>
            <div id="l11-fps" style="position:absolute; top:40px; left:15px; font-weight:bold; font-size:20px; color:#e74c3c; cursor:pointer; z-index:100; font-family:monospace;">FPS: <span id="l11-fps-num">60</span></div>
            
            <div id="l11-wrench" class="emoji-obj hidden" style="font-size:40px; z-index:100; cursor:grab;">🔧</div>
        `;

        const fpsEl = document.getElementById('l11-fps');
        const fpsNum = document.getElementById('l11-fps-num');
        const wrench = document.getElementById('l11-wrench');
        const topBar = document.getElementById('l11-top-bar');
        const screws = document.querySelectorAll('.l11-screw');
        const cage = document.getElementById('l11-cage');
        const blade = document.getElementById('l11-blade');
        const cable = document.getElementById('l11-cable');
        const dev = document.getElementById('l11-dev');
        const coffee = document.getElementById('l11-coffee');
        const loadBar = document.getElementById('l11-loading-bar');
        const cd = document.getElementById('l11-cd');
        const slider = document.getElementById('volume-slider');
        const wire = document.getElementById('l11-wire');
        const cup = document.getElementById('l11-cup');
        const giantBtn = document.getElementById('l11-giant-btn');
        const hintBtn = document.getElementById('hint-btn');

        // BẪY META-TROLL: Bấm Nút Phá Đảo
        giantBtn.onclick = () => {
            if (!levelState.isSafeToClick) {
                triggerFail('Mã lỗi 404! Nút này chỉ để trưng bày, ngây thơ thế thì chơi lại từ đầu đi nhé!', 'Bấm nút Phá Đảo Fake');
            } else {
                // CHIẾN THẮNG CUỐI CÙNG
                giantBtn.style.background = "#fff";
                gameArea.innerHTML = `<div style="text-align:center; margin-top:50px;">
                    <h1 style="font-size:50px; color:#f1c40f; text-shadow:2px 2px #000;">🎊 CHÚC MỪNG 🎊</h1>
                    <p style="font-size:20px; margin-top:20px;">Bạn chính thức là bậc thầy né bẫy!</p>
                </div>`;
                gameArea.classList.add('credits-anim');
                triggerWin('Lễ Đăng Quang Phá Đảo Hoàn Tất!', 'Nhấn Nút Phá Đảo Thật');
            }
        };

        // BƯỚC 1: Đè FPS lấy Cờ-lê
        let fpsInterval;
        fpsEl.onpointerdown = () => {
            if(levelState.wrenchReady) return;
            fpsInterval = setInterval(() => {
                levelState.fps -= 2;
                fpsNum.innerText = levelState.fps;
                if (levelState.fps <= 0) {
                    clearInterval(fpsInterval);
                    fpsEl.style.display = 'none';
                    levelState.wrenchReady = true;
                    
                    // Rớt số 0 biến thành cờ lê
                    const fRect = fpsEl.getBoundingClientRect();
                    const gRect = gameArea.getBoundingClientRect();
                    wrench.classList.remove('hidden');
                    wrench.style.left = (fRect.left - gRect.left) + 'px';
                    wrench.style.top = (fRect.top - gRect.top + 50) + 'px';
                    wrench.classList.add('pop-anim');
                    sendTrackingData('Level 11', 'Đè FPS xuống 0', 'Tạo ra cờ-lê');
                }
            }, 50);
        };
        fpsEl.onpointerup = () => clearInterval(fpsInterval);
        fpsEl.onpointerleave = () => clearInterval(fpsInterval);

        // BƯỚC 2: Tháo 4 ốc vít phá khung kính
        makeDraggable(wrench, (e, dx, dy) => {
            screws.forEach(screw => {
                if (screw.style.display !== 'none' && checkCollision(wrench, screw, 10, 10)) {
                    screw.style.display = 'none';
                    levelState.screwsLeft--;
                    sendTrackingData('Level 11', `Tháo ốc vít (Còn ${levelState.screwsLeft})`, 'Đã gỡ 1 ốc');
                    
                    if (levelState.screwsLeft === 0 && !levelState.cageBroken) {
                        levelState.cageBroken = true;
                        wrench.style.display = 'none'; // Thu hồi cờ lê
                        topBar.style.top = '200px'; // Khung sập xuống
                        setTimeout(() => {
                            cage.style.display = 'none'; // Vỡ lồng
                            topBar.innerText = "💥";
                            topBar.style.background = "transparent";
                            topBar.style.border = "none";
                            topBar.style.fontSize = "60px";
                            topBar.style.textAlign = "center";
                            sendTrackingData('Level 11', 'Khung đè vỡ lồng kính', 'Lồng kính bảo vệ Cúp bị phá hủy');
                        }, 400);
                    }
                }
            });
        });

        // BƯỚC 3 & 4: Lấy dấu sắc cắt cáp mạng
        makeDraggable(blade, null, () => {
            if (checkCollision(blade, cable, 10, 10) && !levelState.devGone) {
                levelState.devGone = true;
                blade.style.display = 'none';
                cable.innerText = "✂️🔌";
                dev.innerText = "😱";
                dev.style.transform = "translateX(250px)"; // Bỏ chạy
                sendTrackingData('Level 11', 'Dùng dấu sắc cắt cáp mạng', 'Dev mất mạng bỏ chạy');
            }
        });

        // BƯỚC 5 & 6: Kéo Cà phê đổ vào Loading Bar sinh ra đĩa CD
        makeDraggable(coffee, null, () => {
            if (levelState.devGone && checkCollision(coffee, loadBar, 10, -10)) {
                coffee.style.display = 'none';
                loadBar.style.background = "#d35400"; // Đổi màu nâu cafe
                loadBar.style.width = "1000%"; // Quá tải
                sendTrackingData('Level 11', 'Đổ cafe vào thanh Loading', 'Thanh loading quá tải 1000%');
                
                setTimeout(() => {
                    const lRect = loadBar.getBoundingClientRect();
                    const gRect = gameArea.getBoundingClientRect();
                    cd.classList.remove('hidden');
                    cd.style.left = '150px';
                    cd.style.top = '300px';
                    cd.classList.add('pop-anim');
                    sendTrackingData('Level 11', 'Thanh Loading phát nổ', 'Văng ra đĩa CD dính bẩn');
                }, 1000);
            } else if (!levelState.devGone && checkCollision(coffee, loadBar, 10, -10)) {
                coffee.style.transform = "translate(0,0)";
                triggerFail('Bị Dev phát hiện ăn trộm cà phê rồi!', 'Lấy cafe khi Dev còn ngồi đó');
            }
        });

        // BƯỚC 7: Chà đĩa CD cho sạch
        makeDraggable(cd, (e, dx, dy) => {
            if (!levelState.cdCleaned) {
                levelState.cdRubScore += Math.abs(dx) + Math.abs(dy);
                if (levelState.cdRubScore > 1000) {
                    levelState.cdCleaned = true;
                    cd.innerText = "📀✨";
                    sendTrackingData('Level 11', 'Chà sạch đĩa CD', 'Đĩa CD mạ bạc sáng bóng');
                }
            }
        }, (e) => {
            // BƯỚC 9: Nhét đĩa CD vào Cúp vàng (khi đã làm bước 8)
            if (levelState.cdCleaned && checkCollision(cd, cup, 20, 20)) {
                if (!levelState.wireBroken) {
                    triggerFail('Nút bấm còn bọc điện, nạp mã nguồn bây giờ là chập cháy hệ thống!', 'Nhét đĩa khi chưa ngắt điện gai');
                } else {
                    levelState.codeInjected = true;
                    cd.style.display = 'none';
                    giantBtn.style.background = "#f1c40f";
                    giantBtn.style.borderColor = "#f39c12";
                    giantBtn.style.color = "#000";
                    giantBtn.innerText = "XÁC NHẬN VINH DANH";
                    sendTrackingData('Level 11', 'Nạp mã nguồn vào Cúp vàng', 'Ghi đè thành công nút Phá Đảo');
                }
            }
        });

        // BƯỚC 8: Phá tường lửa bằng Âm lượng
        slider.onpointerdown = (e) => {
            if (levelState.wireBroken) return;
            e.stopPropagation();
            e.preventDefault(); 
            
            let isSliding = true;
            let startX = e.clientX;
            let startWidth = slider.offsetWidth; // Chiều dài gốc là 120px
            
            // Xử lý khi vuốt ngón tay
            const moveHandler = (ev) => {
                if (!isSliding) return;
                let dx = ev.clientX - startX;
                let newW = startWidth + dx;
                if (newW < 20) newW = 20; 
                slider.style.width = newW + 'px'; // Chỉ thay đổi độ dài, không thay đổi vị trí
                
                // Nếu độ dài bị kéo vượt ngưỡng 200px (Quá tải 200%)
                if (newW >= 200) {
                    slider.style.background = '#e74c3c'; // Chuyển sang màu đỏ cảnh báo
                    slider.style.boxShadow = '0 0 15px #e74c3c'; // Phát sáng đỏ
                } else {
                    slider.style.background = '#ccc';
                    slider.style.boxShadow = 'none';
                }
            };
            
            // Xử lý khi nhả tay ra
            const upHandler = (ev) => {
                if (!isSliding) return;
                isSliding = false;
                document.removeEventListener('pointermove', moveHandler);
                document.removeEventListener('pointerup', upHandler);
                
                // Kiểm tra xem đã kéo đủ chưa
                if (slider.offsetWidth >= 200 && !levelState.wireBroken) {
                    levelState.wireBroken = true;
                    hideModal('settings-modal');
                    
                    // Trả thanh slider lại trạng thái bình thường sau khi nổ
                    slider.style.width = '120px';
                    slider.style.background = '#ccc';
                    slider.style.boxShadow = 'none';

                    // Sóng âm nổ dây thép gai bảo vệ
                    wire.innerText = "💥";
                    wire.classList.add('pop-anim');
                    sendTrackingData('Level 11', 'Kéo Âm lượng lên quá tải 200%', 'Sóng âm phá hủy dây điện thép gai');
                    
                    setTimeout(() => wire.style.display = 'none', 500);
                } else if (!levelState.wireBroken) {
                    // Nếu nhả tay mà chưa kéo đủ 200%, thanh sẽ tự tụt về như cũ
                    slider.style.width = '120px';
                    slider.style.background = '#ccc';
                    slider.style.boxShadow = 'none';
                }
            };
            
            document.addEventListener('pointermove', moveHandler);
            document.addEventListener('pointerup', upHandler);
        };
        // BƯỚC 10: Vô hiệu hóa chống gian lận bằng bóng đèn Hint
        makeDraggable(hintBtn, null, () => {
            if (levelState.codeInjected && checkCollision(hintBtn, cup, 20, 20)) {
                levelState.cupGlowing = true;
                levelState.isSafeToClick = true; // LÚC NÀY NÚT MỚI BẤM ĐƯỢC
                
                hintBtn.style.display = 'none';
                cup.classList.add('l11-glow');
                
                // Bắn pháo hoa mini
                const f1 = document.createElement('div'); f1.innerText = "🎊"; f1.className="emoji-obj pop-anim"; f1.style.cssText = "top:200px; left:50px;"; gameArea.appendChild(f1);
                const f2 = document.createElement('div'); f2.innerText = "🎊"; f2.className="emoji-obj pop-anim"; f2.style.cssText = "top:200px; right:50px;"; gameArea.appendChild(f2);
                
                sendTrackingData('Level 11', 'Đặt bóng đèn lên Cúp vàng', 'Kích hoạt hệ thống Vinh danh');
            }
        }, (e) => {
            // Cho phép kéo nút Hint ra khỏi header
            hintBtn.style.position = 'absolute';
        });
    }

    window.onload = () => {
        console.log("Game Loaded - Session ID:", SESSION_ID);
        loadLevel(currentLevel); // Thay bằng 11 nếu muốn test trực tiếp
    };
</script>
</body>
</html>
