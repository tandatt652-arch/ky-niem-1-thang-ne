<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logic Bẻ Lái - The Gaslight Room</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Comic Neue', cursive, sans-serif;
        }

        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #game-wrapper {
            position: relative;
            width: 420px;
            height: 700px;
            background-color: #fceabb;
            border: 4px solid #000;
            border-radius: 20px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 450px), (max-height: 750px) {
            #game-wrapper {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }
        }

        /* Header */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: #fff;
            border-bottom: 4px solid #000;
            z-index: 10;
        }

        .btn {
            background: #fff;
            border: 3px solid #000;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px #000;
        }

        #level-title {
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Game Area */
        #game-area {
            flex: 1;
            position: relative;
            background: #fdfbfb;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        .question-text {
            font-size: 22px;
            text-align: center;
            margin-bottom: 30px;
            position: absolute;
            top: 20px;
            width: 90%;
            pointer-events: none;
        }

        /* Modals */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-box {
            background: #fff;
            border: 4px solid #000;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            width: 80%;
            box-shadow: 8px 8px 0px #000;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: -15px; right: -15px;
            background: #ff4757;
            color: #fff;
            border: 3px solid #000;
            border-radius: 50%;
            width: 40px; height: 40px;
            font-size: 20px; font-weight: bold;
            cursor: pointer;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        .shake-anim { animation: shake 0.4s ease-in-out; }

        @keyframes pop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .pop-anim { animation: pop 0.5s ease-out; }

        /* Level 1 */
        .scale-container { position: relative; width: 300px; height: 200px; display: flex; justify-content: center; align-items: flex-end; }
        .scale-base { width: 10px; height: 150px; background: #000; position: absolute; bottom: 0; left: 145px; }
        .scale-beam { width: 280px; height: 10px; background: #000; position: absolute; bottom: 140px; transform-origin: center; transform: rotate(15deg); transition: transform 0.2s; }
        .scale-pan { width: 80px; height: 10px; border: 3px solid #000; position: absolute; border-top: none; }
        .pan-left { left: 0; top: 10px; }
        .pan-right { right: 0; top: 10px; }
        .weight { position: absolute; bottom: 10px; border: 3px solid #000; background: #7f8fa6; display: flex; justify-content: center; align-items: center; font-weight: bold;}
        .weight-100 { width: 60px; height: 60px; left: 10px; }
        .weight-5 { width: 30px; height: 30px; right: 25px; }
        .scale-needle { width: 4px; height: 60px; background: #e84118; position: absolute; bottom: 145px; left: 148px; transform-origin: bottom center; transform: rotate(25deg); transition: transform 0.2s; cursor: pointer; }
        .scale-needle::after { content: ''; position: absolute; top: -10px; left: -8px; width: 20px; height: 20px; background: transparent; border-radius: 50%; }
        #progress-bar { width: 0%; height: 10px; background: #4cd137; position: absolute; top: 70px; border-radius: 5px; border: 2px solid #000; display: none; }

        /* Level 2 */
        .math-equation { font-size: 28px; margin-bottom: 40px; }
        .drag-x { display: inline-block; font-size: 32px; font-weight: bold; color: #e84118; cursor: pointer; padding: 0 5px; position: relative; z-index: 50; pointer-events: auto; }
        .ans-btn { display: inline-block; margin: 10px; background: #fbc531; width: 60px; height: 60px; border-radius: 50%; text-align: center; line-height: 54px; font-size: 24px; font-weight: bold; border: 3px solid #000; cursor: pointer; }
        .drop-zone { width: 60px; height: 60px; border: 3px dashed #000; display: inline-block; vertical-align: middle; margin-left: 10px; border-radius: 10px; background: #eee; }

        /* Level 3 */
        .color-btn { width: 200px; padding: 15px; margin: 10px; font-size: 24px; font-weight: bold; border: 3px solid #000; border-radius: 10px; cursor: pointer; box-shadow: 3px 3px 0px #000; }
        .btn-green { background: #4cd137; color: #fff; }
        .btn-red { background: #e84118; color: #fff; }
        .btn-yellow { background: #fbc531; color: #000; }

        /* Level 4 */
        #room { width: 100%; height: 100%; position: absolute; background: #87ceeb; transition: background 1s; }
        .window { width: 120px; height: 150px; border: 5px solid #000; position: absolute; top: 100px; left: 50px; background: #fff; display: flex; justify-content: center; }
        .sun { width: 60px; height: 60px; background: #fbc531; border-radius: 50%; border: 3px solid #000; margin-top: 20px; }
        .bed { position: absolute; bottom: 100px; width: 80%; height: 120px; background: #ff7f50; border: 4px solid #000; border-radius: 20px; display: flex; justify-content: center; }
        .face { width: 150px; height: 150px; background: #ffda79; border: 4px solid #000; border-radius: 50%; position: absolute; top: -70px; display: flex; justify-content: space-around; padding-top: 30px; }
        .eye { width: 40px; height: 60px; background: #fff; border: 3px solid #000; border-radius: 50%; position: relative; overflow: hidden; }
        .pupil { width: 20px; height: 20px; background: #000; border-radius: 50%; position: absolute; bottom: 10px; left: 7px; }
        .eyelid { width: 100%; height: 0%; background: #ffda79; position: absolute; top: 0; left: 0; border-bottom: 2px solid #000; z-index: 2; touch-action: none; cursor: grab; }

        /* Level 5 */
        .big-red-button { width: 150px; height: 150px; background: #ff4757; border: 6px solid #c0392b; border-radius: 50%; font-size: 24px; font-weight: bold; color: white; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 0 #c0392b, 0 15px 10px rgba(0,0,0,0.5); cursor: grab; position: absolute; text-shadow: 2px 2px 0 #000; touch-action: none; }
        .big-red-button:active { box-shadow: 0 2px 0 #c0392b, 0 5px 5px rgba(0,0,0,0.5); border-width: 4px; }
        #timer-display { font-size: 60px; font-weight: bold; color: #ff4757; position: absolute; top: 80px; text-shadow: 2px 2px 0px #000; }
        
        .confetti { position: absolute; width: 10px; height: 10px; background: red; z-index: 200; animation: fall 1.5s linear forwards; }
        @keyframes fall { to { transform: translateY(800px) rotate(720deg); opacity: 0; } }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="header">
        <button class="btn" onclick="showModal('settings-modal')">⚙️</button>
        <div id="level-title">Level 1</div>
        <div>
            <button class="btn" onclick="showHint()">💡</button>
            <button class="btn" onclick="loadLevel(currentLevel)">🔄</button>
        </div>
    </div>

    <div id="game-area"></div>

    <div id="settings-modal" class="modal-overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="hideModal('settings-modal')">X</button>
            <h2>Cài đặt</h2>
            <br>
            <p>Âm lượng: 🔊 ||||||||||</p>
            <br>
            <p>Ngôn ngữ: Tiếng Việt</p>
            <br>
            <div id="settings-secret-area"></div>
        </div>
    </div>

    <div id="hint-modal" class="modal-overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="hideModal('hint-modal')">X</button>
            <h2>💡 Gợi Ý Vô Tri</h2>
            <br>
            <p id="hint-text">Gợi ý nè</p>
        </div>
    </div>

    <div id="result-popup" class="modal-overlay">
        <div class="modal-box" id="result-box">
            <h2 id="result-title" style="font-size: 32px;">Thắng rồi!</h2>
            <br>
            <p id="result-message" style="font-size: 20px; font-style: italic;">Bạn giỏi quá!</p>
            <br><br>
            <button class="btn" id="result-btn" style="background: #4cd137; color: white;">Chơi tiếp</button>
        </div>
    </div>
</div>

<script>
    // --- KHAI BÁO BIẾN TOÀN CỤC & TRACKING ---
    const SESSION_ID = 'VO_YEU_' + Math.random().toString(36).substring(2, 9).toUpperCase(); // Tạo ID phiên chơi
    let currentLevel = 1;
    const gameArea = document.getElementById('game-area');
    let levelTimer = null;
    let dragElement = null;
    let isDragging = false;
    let startX, startY;

    // --- HÀM GỬI DỮ LIỆU LÊN GOOGLE FORM NGẦM ---
    function sendTrackingData(questionContent, userChoice, gameReply) {
        // Dùng URL /formResponse thay vì /viewform để nộp dữ liệu
        const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSe4Jvx2uI27uJQTt9Xn6QdFj59c53kFNIRbxyFeirMOOEFE4g/formResponse";
        
        const formData = new FormData();
        formData.append("entry.1666228409", SESSION_ID);           // ID người chơi
        formData.append("entry.1275903316", questionContent);      // Nội dung câu hỏi/Màn chơi
        formData.append("entry.444679017", userChoice);            // Thao tác của cô ấy
        formData.append("entry.1158846627", gameReply);            // Câu trả lời của Game

        // Gửi ngầm không làm mới trang (no-cors)
        fetch(formUrl, {
            method: "POST",
            mode: "no-cors",
            body: formData
        }).then(() => {
            console.log("Đã track thành công về GG Form!");
        }).catch(err => console.error("Lỗi track GG Form:", err));
    }

    // --- HÀM ĐƯỢC CHẾ LẠI ĐỂ VỪA TRACKING VỪA SHOW KẾT QUẢ ---
    function triggerResult(isWin, msg, questionContext, userAction) {
        // Gửi dữ liệu trước
        sendTrackingData(questionContext, userAction, msg);
        // Hiện popup kết quả như cũ
        showResult(isWin, msg);
    }

    const levelData = {
        1: { title: "Level 1", hint: "Muốn gợi ý thì hỏi anh nè" },
        2: { title: "Level 2", hint: "Chồng em nè hỏi đi" },
        3: { title: "Level 3", hint: "Hỏi chồng em nè" },
        4: { title: "Level 4", hint: "Hỏi đi chồng em giúp cho" },
        5: { title: "Level 5", hint: "Chồng em luôn sẵn sàng giúp ạ" }
    };

    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function hideModal(id) { document.getElementById(id).style.display = 'none'; }
    
    function showHint() {
        document.getElementById('hint-text').innerText = levelData[currentLevel].hint;
        showModal('hint-modal');
        sendTrackingData(`Mở Hint Level ${currentLevel}`, "Bấm xem gợi ý", levelData[currentLevel].hint);
    }

    function showResult(isWin, msg) {
        hideModal('settings-modal'); hideModal('hint-modal');
        const popup = document.getElementById('result-popup');
        const title = document.getElementById('result-title');
        const message = document.getElementById('result-message');
        const btn = document.getElementById('result-btn');
        const box = document.getElementById('result-box');

        popup.style.display = 'flex';
        message.innerText = msg;
        
        if (isWin) {
            title.innerText = "CHÍNH XÁC ròi vợ ơi!";
            title.style.color = "#4cd137";
            btn.innerText = "Màn Tiếp Theo ➡️";
            btn.onclick = () => { hideModal('result-popup'); nextLevel(); };
            box.className = 'modal-box pop-anim';
            createConfetti();
        } else {
            title.innerText = "Bé dở quá!";
            title.style.color = "#e84118";
            btn.innerText = "Thử Lại 🔄";
            btn.onclick = () => { hideModal('result-popup'); loadLevel(currentLevel); };
            box.className = 'modal-box shake-anim';
            const wrapper = document.getElementById('game-wrapper');
            wrapper.classList.remove('shake-anim');
            void wrapper.offsetWidth; 
            wrapper.classList.add('shake-anim');
        }
    }

    function createConfetti() {
        for(let i=0; i<30; i++) {
            let conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + '%';
            conf.style.backgroundColor = ['#e84118', '#4cd137', '#fbc531', '#00a8ff'][Math.floor(Math.random()*4)];
            document.getElementById('game-wrapper').appendChild(conf);
            setTimeout(() => conf.remove(), 1500);
        }
    }

    function nextLevel() {
        currentLevel++;
        if (currentLevel > 5) {
            currentLevel = 1;
            alert("Chúc mừng vợ đã phá đảo con game thiểu năng này!");
            sendTrackingData("Kết thúc Game", "Phá đảo", "Thành công hoàn tất 5 màn");
        }
        loadLevel(currentLevel);
    }

    function makeDraggable(el, onDrag, onDrop, onDragStart) {
        let isDown = false;
        el.style.touchAction = 'none';
        let initialX = 0, initialY = 0;

        el.addEventListener('pointerdown', (e) => {
            isDown = true;
            dragElement = el;
            startX = e.clientX; startY = e.clientY;
            let stylePos = window.getComputedStyle(el).position;
            if (stylePos === 'relative') {
                initialX = parseFloat(el.style.left) || 0;
                initialY = parseFloat(el.style.top) || 0;
            } else {
                initialX = el.offsetLeft;
                initialY = el.offsetTop;
            }
            el.style.zIndex = 1000;
            if(onDragStart) onDragStart(e);
        });

        document.addEventListener('pointermove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            let dx = e.clientX - startX;
            let dy = e.clientY - startY;
            el.style.left = initialX + dx + 'px';
            el.style.top = initialY + dy + 'px';
            if(onDrag) onDrag(e, dx, dy);
        }, {passive: false});

        document.addEventListener('pointerup', (e) => {
            if (!isDown) return;
            isDown = false;
            el.style.zIndex = 50;
            if(onDrop) onDrop(e);
        });
    }

    function checkCollision(el1, el2) {
        const rect1 = el1.getBoundingClientRect();
        const rect2 = el2.getBoundingClientRect();
        return !(rect1.right < rect2.left || rect1.left > rect2.right || rect1.bottom < rect2.top || rect1.top > rect2.bottom);
    }

    function loadLevel(level) {
        clearInterval(levelTimer);
        document.getElementById('level-title').innerText = levelData[level].title;
        document.getElementById('settings-secret-area').innerHTML = ''; 
        
        switch(level) {
            case 1: renderLevel1(); break;
            case 2: renderLevel2(); break;
            case 3: renderLevel3(); break;
            case 4: renderLevel4(); break;
            case 5: renderLevel5(); break;
        }
    }

    // --- LEVEL 1 ---
    function renderLevel1() {
        gameArea.innerHTML = `
            <div class="question-text">Hãy giữ chiếc cân thăng bằng trong 5 giây.</div>
            <div id="progress-bar"></div>
            <div class="scale-container">
                <div class="scale-base"></div>
                <div class="scale-beam" id="beam">
                    <div class="scale-pan pan-left"><div class="weight weight-100" onclick="triggerResult(false, 'Cục tạ 100kg không nhúc nhích!', 'Level 1: Cân công lý', 'Bấm vào quả tạ 100kg')">100</div></div>
                    <div class="scale-pan pan-right"><div class="weight weight-5" onclick="triggerResult(false, 'Cục tạ 5kg, ủa phải 5kg hong ta', 'Level 1: Cân công lý', 'Bấm vào quả tạ 5kg')">5</div></div>
                </div>
                <div class="scale-needle" id="needle"></div>
            </div>
        `;

        const needle = document.getElementById('needle');
        const beam = document.getElementById('beam');
        const progress = document.getElementById('progress-bar');
        let holdTimer = null;
        let ms = 0;

        const startHold = (e) => {
            e.preventDefault();
            needle.style.transform = 'rotate(0deg)';
            beam.style.transform = 'rotate(0deg)';
            progress.style.display = 'block';
            ms = 0;
            holdTimer = setInterval(() => {
                ms += 50;
                progress.style.width = (ms / 5000) * 100 + '%';
                if (ms >= 5000) {
                    clearInterval(holdTimer);
                    triggerResult(true, 'Thăng bằng rồi! Cơ tay vợ mạnh thiệt đó!', 'Level 1: Cân công lý', 'Giữ đúng kim cân trong 5 giây');
                }
            }, 50);
        };

        const stopHold = () => {
            clearInterval(holdTimer);
            if (ms > 0 && ms < 5000) {
                needle.style.transform = 'rotate(25deg)';
                beam.style.transform = 'rotate(15deg)';
                progress.style.width = '0%';
                progress.style.display = 'none';
                sendTrackingData('Level 1: Cân công lý', `Giữ kim cân được ${ms/1000}s rồi thả`, 'Trượt ngã làm lại');
                ms = 0;
            }
        };

        needle.addEventListener('pointerdown', startHold);
        document.addEventListener('pointerup', stopHold);
    }

    // --- LEVEL 2 ---
    function renderLevel2() {
        gameArea.innerHTML = `
            <div class="question-text">Tính phương trình: <br><br><span style="font-size:28px;">Tính <span class="drag-x" id="the-x">x</span>² + 5x + 6 = 0</span><br><br>Tìm x cho chồng i.</div>
            
            <div style="margin-top: 150px; display:flex; justify-content:center; align-items:center;">
                <span style="font-size:24px; font-weight:bold;">x = </span>
                <div class="drop-zone" id="drop-x"></div>
            </div>

            <div style="margin-top: 50px;">
                <div class="ans-btn" onclick="triggerResult(false, 'Học giỏi toán quá cũng khổ!', 'Level 2: Phương trình', 'Bấm chọn đáp án -2')">-2</div>
                <div class="ans-btn" onclick="triggerResult(false, 'Tính ra -3 là dở rồi!', 'Level 2: Phương trình', 'Bấm chọn đáp án -3')">-3</div>
                <div class="ans-btn" onclick="triggerResult(false, 'Sai bét!', 'Level 2: Phương trình', 'Bấm chọn đáp án ±5')">±5</div>
                <div class="ans-btn" onclick="triggerResult(false, 'Về lớp 1 học lại i vợ!', 'Level 2: Phương trình', 'Bấm chọn đáp án 0')">0</div>
            </div>
        `;

        const theX = document.getElementById('the-x');
        const dropZone = document.getElementById('drop-x');

        makeDraggable(theX, null, () => {
            if (checkCollision(theX, dropZone)) {
                theX.style.visibility = 'hidden'; 
                dropZone.innerText = 'x';
                dropZone.style.color = '#e84118';
                dropZone.style.fontSize = '32px';
                dropZone.style.fontWeight = 'bold';
                dropZone.style.lineHeight = '54px';
                dropZone.style.textAlign = 'center';
                triggerResult(true, 'Quá xuất sắc! Vợ tui quá là giỏi luôn!', 'Level 2: Phương trình', 'Kéo chữ X trên đề bài bỏ vào ô trống');
            }
        });
    }

    // --- LEVEL 3 ---
    function renderLevel3() {
        gameArea.innerHTML = `
            <div class="question-text">Nhấn nút màu Đỏ</div>
            <div style="margin-top: 100px; display:flex; flex-direction:column; align-items:center;">
                <button class="color-btn btn-green" onclick="triggerResult(false, 'Vợ bị lừa rồi nhé! Nút này màu xanh lá mà!', 'Level 3: Nút màu đỏ', 'Bấm nút xanh lá ghi chữ Đỏ')">Đỏ</button>
                <button class="color-btn btn-red" onclick="triggerResult(false, 'Vợ bị lừa rồi nhé! Chữ ghi Xanh mà!', 'Level 3: Nút màu đỏ', 'Bấm nút đỏ ghi chữ Xanh')">Xanh</button>
                <button class="color-btn btn-yellow" onclick="triggerResult(false, ' Nút này màu Vàng cơ mà =))', 'Level 3: Nút màu đỏ', 'Bấm nút vàng ghi chữ Vàng')">Vàng</button>
            </div>
        `;

        const secretBtn = document.createElement('button');
        secretBtn.className = 'color-btn btn-red';
        secretBtn.innerText = 'Nút màu Đỏ';
        secretBtn.style.padding = '10px';
        secretBtn.style.fontSize = '18px';
        secretBtn.onclick = () => { triggerResult(true, 'Vợ tìm ở đâu ra hay vậy?', 'Level 3: Nút màu đỏ', 'Mở Settings và bấm nút Đỏ bí mật'); };
        document.getElementById('settings-secret-area').appendChild(document.createElement('hr'));
        document.getElementById('settings-secret-area').appendChild(secretBtn);
    }

    // --- LEVEL 4 ---
    function renderLevel4() {
        gameArea.innerHTML = `
            <div class="question-text" style="z-index: 10; background: rgba(255,255,255,0.7); padding:5px; border-radius:10px;">Buồn ngủ quá, Làm sao để chồng ngủ đây?</div>
            <div id="room">
                <div class="window" onclick="triggerResult(false, 'Đèn đường của thành phố, không tắt được đâu vợ ạ!', 'Level 4: Làm sao để ngủ', 'Bấm vào cửa sổ / mặt trời')">
                    <div class="sun"></div>
                </div>
                <div class="bed" onclick="triggerResult(false, 'Gõ vào giường làm gì? Nằm im đi!', 'Level 4: Làm sao để ngủ', 'Bấm vào cái giường')">
                    <div class="face">
                        <div class="eye">
                            <div class="pupil"></div>
                            <div class="eyelid" id="eye1"></div>
                        </div>
                        <div class="eye">
                            <div class="pupil"></div>
                            <div class="eyelid" id="eye2"></div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        const eye1 = document.getElementById('eye1');
        const eye2 = document.getElementById('eye2');
        const room = document.getElementById('room');
        let isDown = false;
        let startY = 0;

        const touchStart = (e) => {
            isDown = true;
            startY = e.clientY || e.touches[0].clientY;
        };

        const touchMove = (e) => {
            if (!isDown) return;
            e.preventDefault();
            let currentY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            let diff = currentY - startY;
            if (diff > 0) {
                let percent = Math.min((diff / 40) * 100, 100);
                eye1.style.height = percent + '%';
                eye2.style.height = percent + '%';
                room.style.background = `rgba(135, 206, 235, ${1 - percent/100})`;
                
                if (percent === 100) {
                    isDown = false;
                    room.style.background = '#2c3e50';
                    setTimeout(() => triggerResult(true, 'Khò khò... ngủ ngon quá vợ oii!', 'Level 4: Làm sao để ngủ', 'Vuốt mắt cho nhắm lại thành công'), 500);
                }
            }
        };

        const touchEnd = () => {
            if (eye1.style.height !== '100%') {
                eye1.style.height = '0%';
                eye2.style.height = '0%';
                room.style.background = '#87ceeb';
            }
            isDown = false;
        };

        const face = document.querySelector('.face');
        face.addEventListener('pointerdown', touchStart);
        document.addEventListener('pointermove', touchMove, {passive: false});
        document.addEventListener('pointerup', touchEnd);
    }

    // --- LEVEL 5 ---
    function renderLevel5() {
        gameArea.innerHTML = `
            <div id="timer-display">10</div>
            <div class="big-red-button" id="big-btn" style="top: 50%; left: 50%; transform: translate(-50%, -50%);">CẤM BẤM</div>
        `;

        let timeLeft = 10;
        const timerDisplay = document.getElementById('timer-display');
        const btn = document.getElementById('big-btn');
        const wrapper = document.getElementById('game-wrapper');

        levelTimer = setInterval(() => {
            timeLeft--;
            timerDisplay.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(levelTimer);
                triggerResult(false, 'Bộ tưởng chờ thoi là thắng hả', 'Level 5: Cấm bấm nút', 'Đợi hết 10 giây không làm gì cả');
            }
        }, 1000);

        let clickFlag = false;

        makeDraggable(btn, 
            (e, dx, dy) => { 
                if(Math.abs(dx) > 5 || Math.abs(dy) > 5) clickFlag = true;
                
                const btnRect = btn.getBoundingClientRect();
                const wrapRect = wrapper.getBoundingClientRect();
                
                if (btnRect.right < wrapRect.left || btnRect.left > wrapRect.right || btnRect.bottom < wrapRect.top || btnRect.top > wrapRect.bottom) {
                    clearInterval(levelTimer);
                    triggerResult(true, 'Không còn nút màu đỏ nữa ròi hihi', 'Level 5: Cấm bấm nút', 'Kéo vứt cái nút đỏ ra khỏi màn hình');
                    btn.style.display = 'none'; 
                }
            }, 
            (e) => { 
                if (!clickFlag) {
                    clearInterval(levelTimer);
                    triggerResult(false, 'Đã bảo CẤM BẤM rồi mà, vợ lì quá nha', 'Level 5: Cấm bấm nút', 'Cố tình bấm vào nút đỏ');
                }
            },
            (e) => { 
                clickFlag = false;
            }
        );
    }

    // Khởi động
    window.onload = () => {
        console.log("Game Loaded - Session ID:", SESSION_ID);
        sendTrackingData("Khởi động Game", "Bắt đầu chơi", "Game sẵn sàng");
        loadLevel(currentLevel);
    };

</script>
